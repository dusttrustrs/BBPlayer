name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动一键触发构建
  push:
    branches:
      - master
      - main
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build Unsigned IPA
    # 关键修复 1：必须使用 macos-26 (Apple Silicon arm64，默认预装 Xcode 26.6 / Build 17F113 / Swift 6.3.3 / iOS 26.5 Runtime)
    # 原因：
    # 1) 项目启用的 @rnrepo/expo-config-plugin 预编译 xcframework 产物均由 Xcode 26.6 (17F113, Swift 6.3.3, iphoneos26.5) 编译，
    #    在 macos-15 (Xcode 16.4 / Swift 6.1 或最高 Xcode 26.3 / Swift 6.2) 上会因编译器与 SDK 版本过旧导致编译失败 (exit code 65)。
    # 2) macos-26 默认自带与 Xcode 26.6 完全匹配的 iOS 26.5 Simulator Runtime，actool 编译 Assets.xcassets 不会再报版本不匹配。
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: 🏗️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史以便 app.config.ts 计算 git commit 数量作为 versionCode

      - name: 🍎 校验并选择与 Simulator Runtime 精确匹配的 Xcode
        run: |
          echo "=== Runner 已安装的 Xcode 列表 ==="
          ls -d /Applications/Xcode*.app

          echo "=== Runner 已安装的 Simulator Runtimes ==="
          xcrun simctl list runtimes -v || true

          # 提取已安装的 Simulator Runtime Build 版本号集合
          INSTALLED_RUNTIMES=$(xcrun simctl list runtimes | grep -oE '[0-9]{2}[A-Z][0-9A-Za-z]+' || true)

          # 先检查当前默认 Xcode 的 SDKSettings.plist 是否已精确匹配 Runtime
          CURRENT_SDK_BUILD=$(xcrun --sdk iphonesimulator --show-sdk-build-version 2>/dev/null || echo "")
          echo "当前默认 Xcode iphonesimulator SDK Build: $CURRENT_SDK_BUILD"

          if [ -z "$CURRENT_SDK_BUILD" ] || ! echo "$INSTALLED_RUNTIMES" | grep -qx "$CURRENT_SDK_BUILD"; then
            echo "默认 Xcode SDK ($CURRENT_SDK_BUILD) 未精确匹配 Runtime，开始从高到低自动搜索匹配的 Xcode..."
            for xcode in $(ls -d /Applications/Xcode_*.app | sort -V -r); do
              SDK_SETTINGS="$xcode/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/SDKSettings.plist"
              if [ -f "$SDK_SETTINGS" ]; then
                SDK_BUILD=$(/usr/libexec/PlistBuddy -c "Print :DefaultProperties:BUILD_VERSION" "$SDK_SETTINGS" 2>/dev/null || echo "")
                echo "检查 $xcode -> SDK Build: $SDK_BUILD"
                if [ -n "$SDK_BUILD" ] && echo "$INSTALLED_RUNTIMES" | grep -qx "$SDK_BUILD"; then
                  echo "✅ 切换至与 Simulator Runtime ($SDK_BUILD) 100% 匹配的 Xcode: $xcode"
                  sudo xcode-select -s "$xcode/Contents/Developer"
                  break
                fi
              fi
            done
          else
            echo "✅ 当前默认 Xcode 已与已安装的 Simulator Runtime ($CURRENT_SDK_BUILD) 100% 匹配"
          fi

          xcodebuild -version
          xcrun swiftc -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-build-version

      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📥 安装依赖
        env:
          LEFTHOOK: "0" # 跳过 Git Hook 安装
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🩹 修复 ExpoOrpheus 在 iOS 26 SDK / Swift 6.3 下的编译错误
        run: |
          node << 'EOF'
          const fs = require("fs");

          // 1. 修复 AudioSpectrumAnalyzer.swift：
          // iOS 26 SDK 为 MTAudioProcessingTapCreate 添加了 CF_RETURNS_RETAINED 注解，
          // 第 4 个参数从 UnsafeMutablePointer<Unmanaged<MTAudioProcessingTap>?> 变为 UnsafeMutablePointer<MTAudioProcessingTap?>
          const analyzerPath = "packages/orpheus/ios/AudioSpectrumAnalyzer.swift";
          let analyzer = fs.readFileSync(analyzerPath, "utf8");
          const tapPattern = /var tap: Unmanaged<MTAudioProcessingTap>\?[\s\S]*?return tap\?\.takeRetainedValue\(\)\s*\}/;
          if (tapPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              tapPattern,
          `#if compiler(>=6.2)
                  var tap: MTAudioProcessingTap?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap
                  }
                  #else
                  var tap: Unmanaged<MTAudioProcessingTap>?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap?.takeRetainedValue()
                  }
                  #endif`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 MTAudioProcessingTapCreate 类型签名");
          } else if (!analyzer.includes("#if compiler(>=6.2)")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 MTAudioProcessingTapCreate 代码块");
          }

          // 同时修复 DSPSplitComplex 临时指针作用域与 vDSP_vsmul(&magnitudes, ..., &magnitudes, ...) 的 Swift 内存独占访问冲突 (overlapping accesses to 'magnitudes')
          const dspPattern = /var splitComplex = DSPSplitComplex\(realp: &realOut, imagp: &imagOut\)[\s\S]*?vDSP_vsmul\(&magnitudes, 1, &scale, &magnitudes, 1, vDSP_Length\(fftSize\)\)/;
          if (dspPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              dspPattern,
          `var scale = 1.0 / Float(fftSize)
                  realOut.withUnsafeMutableBufferPointer { realPtr in
                      imagOut.withUnsafeMutableBufferPointer { imagPtr in
                          magnitudes.withUnsafeMutableBufferPointer { magPtr in
                              guard let realBase = realPtr.baseAddress,
                                    let imagBase = imagPtr.baseAddress,
                                    let magBase = magPtr.baseAddress else { return }
                              var splitComplex = DSPSplitComplex(realp: realBase, imagp: imagBase)
                              vDSP_zvabs(&splitComplex, 1, magBase, 1, vDSP_Length(fftSize))
                              vDSP_vsmul(magBase, 1, &scale, magBase, 1, vDSP_Length(fftSize))
                          }
                      }
                  }`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 DSPSplitComplex 指针作用域与 vDSP_vsmul 内存独占访问冲突");
          } else if (!analyzer.includes("vDSP_vsmul(magBase")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 DSPSplitComplex / vDSP_vsmul 代码块");
          }
          fs.writeFileSync(analyzerPath, analyzer, "utf8");

          // 2. 修复 ExpoOrpheusModule.swift：
          // (a) 多语句 .set 闭包无法自动推断泛型参数 $0 的类型，需显式声明 (enabled: Bool) in
          const modulePath = "packages/orpheus/ios/ExpoOrpheusModule.swift";
          let mod = fs.readFileSync(modulePath, "utf8");
          const propPattern = /Property\("isSpectrumVisualizerEnabled"\)\s*\.get\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled\s*\}\s*\.set\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled = \$0\s*self\.sendEvent\("onSpectrumVisualizerEnabledChanged", \["enabled": \$0\]\)\s*\}/;
          if (propPattern.test(mod)) {
            mod = mod.replace(
              propPattern,
          `Property("isSpectrumVisualizerEnabled")
                      .get { GeneralStorage.shared.isSpectrumVisualizerEnabled }
                      .set { (enabled: Bool) in
                          GeneralStorage.shared.isSpectrumVisualizerEnabled = enabled
                          self.sendEvent("onSpectrumVisualizerEnabledChanged", ["enabled": enabled])
                      }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 isSpectrumVisualizerEnabled .set 闭包类型注解");
          } else if (!mod.includes("(enabled: Bool) in")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 isSpectrumVisualizerEnabled 代码块");
          }

          // (b) 修复 updateSpectrumData 中不存在的 TypedArray.getUnsafeMutablePointer 方法，
          // 改用 ExpoModulesCore 标准公开属性 destination.rawPointer.bindMemory(to:capacity:)
          const spectrumPattern = /Function\("updateSpectrumData"\)\s*\{\s*\(destination:\s*TypedArray\)\s*in[\s\S]*?fillSpectrumData\(destination:\s*ptr,\s*count:\s*count\)\s*\}\s*\}/;
          if (spectrumPattern.test(mod)) {
            mod = mod.replace(
              spectrumPattern,
          `Function("updateSpectrumData") { (destination: TypedArray) in
                  let count = destination.length
                  guard count > 0, destination.byteLength >= count * MemoryLayout<Float32>.stride else { return }
                  let ptr = destination.rawPointer.bindMemory(to: Float32.self, capacity: count)
                  AudioSpectrumAnalyzer.shared.fillSpectrumData(destination: ptr, count: count)
              }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 updateSpectrumData TypedArray 指针调用");
          } else if (!mod.includes("destination.rawPointer.bindMemory")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 updateSpectrumData 代码块");
          }

          // (c) 修复 iOS 端 setAllowSimultaneousPlayback 缺失导致的设置页闪退与后台混音失效
          if (!mod.includes("setAllowSimultaneousPlayback")) {
            const target = 'Function("setDownloadMaxParallelTasks") { (_: Int) in';
            const replacement = [
              'AsyncFunction("setAllowSimultaneousPlayback") { (enabled: Bool) in',
              '        OrpheusPlayerManager.shared.setAllowSimultaneousPlayback(enabled)',
              '    }',
              '',
              '    Function("setDownloadMaxParallelTasks") { (_: Int) in'
            ].join("\n");
            mod = mod.replace(target, replacement);
            console.log("✅ 已为 ExpoOrpheusModule.swift 补充 setAllowSimultaneousPlayback 方法");
          }
          fs.writeFileSync(modulePath, mod, "utf8");

          // (d) 为 OrpheusPlayerManager.swift 补充 addToEnd / addToNext 的 onQueueChanged 通知
          const playerMgrPath = "packages/orpheus/ios/OrpheusPlayerManager.swift";
          if (fs.existsSync(playerMgrPath)) {
            let playerMgr = fs.readFileSync(playerMgrPath, "utf8");
            // 在 addToEnd 和 addToNext 尾部触发 onQueueChanged，确保播放队列实时同步
            if (!playerMgr.includes("// queue sync patched")) {
              playerMgr = playerMgr.replace(
                "queueManager.insertNext(track: track)\n        saveState()",
                "queueManager.insertNext(track: track)\n        saveState()\n        onQueueChanged?() // queue sync patched"
              );
              const addToEndEndPattern = /saveState\(\)\s*\}\s*func setExecuteShuffleMode/;
              if (addToEndEndPattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(
                  addToEndEndPattern,
                  "saveState()\n        }\n        onQueueChanged?()\n    }\n    \n    func setExecuteShuffleMode"
                );
              }
              fs.writeFileSync(playerMgrPath, playerMgr, "utf8");
              console.log("✅ 已为 OrpheusPlayerManager.swift 补充 addToEnd / addToNext 的 onQueueChanged 通知");
            }
          }

          // (e) 为 ExpoOrpheusModule.swift 补齐 iOS 端缺失的原生方法与属性（如 getLruCachedUris 等），防止运行时抛出 undefined is not a function
          if (!mod.includes("getLruCachedUris")) {
            // 补充缺失的属性：playbackResumeStrategy, isDesktopLyricsShown 等
            const propAnchor = 'Property("isSpectrumVisualizerEnabled")';
            const missingProps = [
              'Property("playbackResumeStrategy")',
              '            .get { 0 }',
              '            .set { (_: Int) in }',
              '',
              '        Property("isDesktopLyricsShown")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isDesktopLyricsLocked")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isStatusBarLyricsEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isCarLyricsEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("statusBarLyricsProvider")',
              '            .get { "lyricon" }',
              '            .set { (_: String) in }',
              '',
              '        Property("isSuperLyricApiEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isLyriconApiEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isSpectrumVisualizerEnabled")'
            ].join("\n");
            mod = mod.replace(propAnchor, missingProps);

            // 放宽 addToEnd 参数签名，避免参数转换失败
            const addToEndPattern = /AsyncFunction\("addToEnd"\)\s*\{\s*\(tracks:\s*\[Track\],\s*startFromId:\s*String\?,\s*clearQueue:\s*Bool\)\s*in/;
            if (addToEndPattern.test(mod)) {
              mod = mod.replace(
                addToEndPattern,
                'AsyncFunction("addToEnd") { (tracks: [Track], startFromId: String?, clearQueue: Bool?) in\n        let shouldClear = clearQueue ?? false'
              );
              mod = mod.replace('clearQueue: clearQueue)', 'clearQueue: shouldClear)');
            }

            // 补充缺失的方法：getLruCachedUris, clearPlaybackCache, downloadMissingCovers 等
            const funcAnchor = 'Function("updateSpectrumData")';
            const missingFuncs = [
              'Function("getLruCachedUris") { (uris: [String]) -> [String] in',
              '        return []',
              '    }',
              '',
              '    AsyncFunction("clearPlaybackCache") {',
              '    }',
              '',
              '    AsyncFunction("downloadMissingCovers") { () -> Int in',
              '        return 0',
              '    }',
              '',
              '    Function("getDownloadedCoverUri") { (_: String) -> String? in',
              '        return nil',
              '    }',
              '',
              '    AsyncFunction("exportDownloads") { (_: [String], _: String, _: String?, _: Bool, _: Bool, _: Bool) in',
              '    }',
              '',
              '    AsyncFunction("selectDirectory") { () -> String? in',
              '        return nil',
              '    }',
              '',
              '    AsyncFunction("isDirectoryPickerAvailable") { () -> Bool in',
              '        return false',
              '    }',
              '',
              '    Function("exportData") { () -> [String: Any] in',
              '        return ["playerQueue": [String: Any](), "loudness": [String: Double]() ]',
              '    }',
              '',
              '    Function("importData") { (_: [String: Any]) in',
              '    }',
              '',
              '    Function("updateSpectrumData")'
            ].join("\n");
            mod = mod.replace(funcAnchor, missingFuncs);
            fs.writeFileSync(modulePath, mod, "utf8");
            console.log("✅ 已为 ExpoOrpheusModule.swift 补全 getLruCachedUris 等缺失原生方法与属性");
          }
          EOF

      - name: 🩹 修复 iOS 运行时崩溃、播放器、后台播放与菜单弹窗组件异常
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          // 1. 修复 TabLayout 模块加载时的同步原生调用异常：
          // 引入 getSafeIcon 防御性封装，在捕获到任何异常时优雅回退为默认图标对象。
          const layoutPath = "apps/mobile/src/app/(tabs)/_layout.tsx";
          if (fs.existsSync(layoutPath)) {
            let layout = fs.readFileSync(layoutPath, "utf8");
            const iconPattern = /const searchIcon = Icon\.getImageSourceSync\('magnify', 24\)[\s\S]*?const profileIcon = Icon\.getImageSourceSync\('account', 24\) as nonNullableIcon/;
            if (iconPattern.test(layout)) {
              const safeIconBlock = [
                "const getSafeIcon = (glyph: string, size = 24): nonNullableIcon => {",
                "  try {",
                "    const icon = Icon.getImageSourceSync(glyph, size) as nonNullableIcon",
                "    if (icon && icon.uri) return icon",
                "  } catch (e) {",
                "    console.warn('[TabLayout] getImageSourceSync failed for ' + glyph, e)",
                "  }",
                "  return { uri: '', scale: 1 }",
                "}",
                "",
                "const searchIcon = getSafeIcon('magnify', 24)",
                "const libraryIcon = getSafeIcon('bookshelf', 24)",
                "const profileIcon = getSafeIcon('account', 24)"
              ].join("\n");
              layout = layout.replace(iconPattern, safeIconBlock);
              fs.writeFileSync(layoutPath, layout, "utf8");
              console.log("✅ 已成功为 (tabs)/_layout.tsx 注入安全的 getSafeIcon 异常防护");
            }
          }

          // 2. 修复 app.config.ts：声明 UIAppFonts、ExpoShareIntoAppGroupId 以及 UIBackgroundModes (audio)
          // 彻底解决 iOS 字体缺失、共享 App Group 报错以及后台播放被系统挂起（返回桌面立即暂停）的问题。
          const configPath = "apps/mobile/app.config.ts";
          if (fs.existsSync(configPath)) {
            let cfg = fs.readFileSync(configPath, "utf8");
            const iosPattern = /(\bios:\s*\{[\r\n\s]*bundleIdentifier:)/;
            if (iosPattern.test(cfg)) {
              const iosBlock = [
                "ios: {",
                "      infoPlist: {",
                "        UIAppFonts: ['MaterialDesignIcons.ttf'],",
                "        ExpoShareIntoAppGroupId: 'group.com.roitium.bbplayer',",
                "        UIBackgroundModes: ['audio'],",
                "      },",
                "      bundleIdentifier:"
              ].join("\n");
              cfg = cfg.replace(iosPattern, iosBlock);
              fs.writeFileSync(configPath, cfg, "utf8");
              console.log("✅ 已向 app.config.ts 注入 UIAppFonts, ExpoShareIntoAppGroupId 与 UIBackgroundModes(audio)");
            }
          }

          // 3. 修复 WavySlider 在 iOS 端的平滑拖动与原生触控 (彻底消除卡顿、跳跃与回弹)：
          const wavyPath = "packages/expo-wavy-slider/src/WavySlider.ts";
          if (fs.existsSync(wavyPath)) {
            let wavy = fs.readFileSync(wavyPath, "utf8");
            const wavyPattern = /if\s*\(\s*Platform\.OS\s*!==\s*['"]android['"]\s*\|\|\s*!NativeWavySlider\s*\)\s*\{[\s\S]*?throw new Error\([\s\S]*?\)\s*\}/;
            if (wavyPattern.test(wavy)) {
              const wavyReplacement = [
                "if (Platform.OS !== 'android' || !NativeWavySlider) {",
                "    return createElement(IOSSliderFallback, {",
                "      ...props,",
                "      progress,",
                "      value,",
                "      min,",
                "      max,",
                "      enabled,",
                "      colors: props.colors,",
                "      onValueChange,",
                "      onValueChangeFinished,",
                "      onDragStateChange,",
                "      trackThickness,",
                "    })",
                "  }"
              ].join("\n");

              const fallbackCode = [
                "",
                "function IOSSliderFallback(props: WavySliderProps) {",
                "  const {",
                "    progress,",
                "    value = 0,",
                "    min = 0,",
                "    max = 1,",
                "    enabled = true,",
                "    colors,",
                "    onValueChange,",
                "    onValueChangeFinished,",
                "    onDragStateChange,",
                "    style,",
                "    trackThickness = 4,",
                "  } = props",
                "  const [sliderWidth, setSliderWidth] = useState(0)",
                "  const isDraggingShared = useSharedValue(false)",
                "  const localProgress = useSharedValue(value)",
                "  const thumbScale = useSharedValue(1)",
                "  const startTouchXRef = useRef(0)",
                "  const sliderWidthRef = useRef(0)",

                "  const handleLayout = (e: any) => {",
                "    const w = e.nativeEvent.layout.width",
                "    setSliderWidth(w)",
                "    sliderWidthRef.current = w",
                "  }",

                "  useAnimatedReaction(",
                "    () => {",
                "      'worklet'",
                "      if (progress && typeof progress === 'object' && 'value' in progress) {",
                "        return (progress as SharedValue<number>).value",
                "      }",
                "      return value",
                "    },",
                "    (current) => {",
                "      'worklet'",
                "      if (!isDraggingShared.value) {",
                "        localProgress.value = current",
                "      }",
                "    }",
                "  )",

                "  const activeColor = (colors?.activeTrackColor as string) || '#a855f7'",
                "  const inactiveColor = (colors?.inactiveTrackColor as string) || 'rgba(150, 150, 150, 0.3)'",
                "  const thumbColor = (colors?.thumbColor as string) || activeColor",

                "  const panResponder = useMemo(",
                "    () =>",
                "      PanResponder.create({",
                "        onStartShouldSetPanResponder: () => enabled,",
                "        onMoveShouldSetPanResponder: (_, gestureState) => {",
                "          return enabled && (Math.abs(gestureState.dx) > 2 || Math.abs(gestureState.dy) < 15)",
                "        },",
                "        onPanResponderTerminationRequest: () => false,",
                "        onPanResponderGrant: (evt) => {",
                "          isDraggingShared.value = true,",
                "          thumbScale.value = withTiming(1.25, { duration: 150 })",
                "          onDragStateChange?.(true)",
                "          const width = sliderWidthRef.current || 1",
                "          const locationX = Math.max(0, Math.min(width, evt.nativeEvent.locationX))",
                "          startTouchXRef.current = locationX",
                "          const fraction = locationX / width",
                "          const actualVal = min + fraction * (max - min)",
                "          localProgress.value = actualVal",
                "          onValueChange?.(actualVal)",
                "        },",
                "        onPanResponderMove: (_, gestureState) => {",
                "          const width = sliderWidthRef.current || 1",
                "          const currentX = Math.max(0, Math.min(width, startTouchXRef.current + gestureState.dx))",
                "          const fraction = currentX / width",
                "          const actualVal = min + fraction * (max - min)",
                "          localProgress.value = actualVal",
                "          onValueChange?.(actualVal)",
                "        },",
                "        onPanResponderRelease: () => {",
                "          thumbScale.value = withTiming(1, { duration: 150 })",
                "          onDragStateChange?.(false)",
                "          onValueChangeFinished?.(localProgress.value)",
                "          setTimeout(() => {",
                "            isDraggingShared.value = false",
                "          }, 500)",
                "        },",
                "        onPanResponderTerminate: () => {",
                "          thumbScale.value = withTiming(1, { duration: 150 })",
                "          onDragStateChange?.(false)",
                "          onValueChangeFinished?.(localProgress.value)",
                "          setTimeout(() => {",
                "            isDraggingShared.value = false",
                "          }, 500)",
                "        },",
                "      }),",
                "    [enabled, min, max, onValueChange, onValueChangeFinished, onDragStateChange]",
                "  )",

                "  const activeTrackStyle = useAnimatedStyle(() => {",
                "    'worklet'",
                "    const fraction = (localProgress.value - min) / (max - min || 1)",
                "    const clamped = Math.max(0, Math.min(1, fraction))",
                "    return { width: clamped * 100 + '%' }",
                "  })",

                "  const thumbStyle = useAnimatedStyle(() => {",
                "    'worklet'",
                "    const fraction = (localProgress.value - min) / (max - min || 1)",
                "    const clamped = Math.max(0, Math.min(1, fraction))",
                "    const left = clamped * (sliderWidth || 0)",
                "    return {",
                "      transform: [",
                "        { translateX: left - 7 },",
                "        { scale: thumbScale.value }",
                "      ]",
                "    }",
                "  })",

                "  const thickness = typeof trackThickness === 'number' ? trackThickness : 4",

                "  return createElement(",
                "    View,",
                "    {",
                "      style: [iosSliderStyles.container, style],",
                "      onLayout: handleLayout,",
                "      hitSlop: { top: 15, bottom: 15, left: 10, right: 10 },",
                "      ...panResponder.panHandlers,",
                "    },",
                "    createElement(",
                "      View,",
                "      {",
                "        pointerEvents: 'none',",
                "        style: [iosSliderStyles.track, { height: thickness, backgroundColor: inactiveColor }],",
                "      },",
                "      createElement(Animated.View, {",
                "        pointerEvents: 'none',",
                "        style: [iosSliderStyles.activeTrack, { height: thickness, backgroundColor: activeColor }, activeTrackStyle],",
                "      })",
                "    ),",
                "    createElement(Animated.View, {",
                "      pointerEvents: 'none',",
                "      style: [iosSliderStyles.thumb, { backgroundColor: thumbColor }, thumbStyle],",
                "    })",
                "  )",
                "}",

                "const iosSliderStyles = StyleSheet.create({",
                "  container: { height: 32, justifyContent: 'center' },",
                "  track: { width: '100%', borderRadius: 2, overflow: 'hidden' },",
                "  activeTrack: { position: \'absolute\', left: 0, top: 0, borderRadius: 2 },",
                "  thumb: {",
                "    position: 'absolute',",
                "    top: '50%',",
                "    marginTop: -7,",
                "    left: 0,",
                "    width: 14,",
                "    height: 14,",
                "    borderRadius: 7,",
                "    shadowColor: '#000',",
                "    shadowOffset: { width: 0, height: 1 },",
                "    shadowOpacity: 0.3,",
                "    shadowRadius: 2,",
                "  },",
                "})"
              ].join("\n");

              wavy = wavy.replace(
                "import { requireNativeView } from 'expo'",
                [
                  "import { requireNativeView } from 'expo'",
                  "import { useState, useRef, useMemo } from 'react'",
                  "import { PanResponder, StyleSheet, View } from 'react-native'",
                  "import Animated, { useAnimatedStyle, useSharedValue, useAnimatedReaction, withTiming, type SharedValue } from 'react-native-reanimated'"
                ].join("\n")
              );
              wavy = wavy.replace(wavyPattern, wavyReplacement) + "\n" + fallbackCode;
              fs.writeFileSync(wavyPath, wavy, "utf8");
              console.log("✅ 已成功为 WavySlider 注入 iOS 专用的高帧率平滑触控滑动条 Fallback");
            }
          }

          // 4. 修复二级菜单与弹窗按钮无法点击的问题：
          // (a) apps/mobile/src/app/modal.tsx 中移除 <Portal>，防止弹窗内容被传送至透明原生 Screen 背后导致无法接收点击事件
          const modalPath = "apps/mobile/src/app/modal.tsx";
