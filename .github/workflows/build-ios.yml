              "            { name: 'http:fetch:update-manifest', op: 'http' },",
              "            () =>",
              "                fetch('https://api.github.com/repos/dusttrustrs/BBPlayer-iOS-Package/releases/latest', {",
              "                    cache: 'no-store',",
