          // 9. 修复倍速弹窗在 iOS 端因引入 @expo/ui/jetpack-compose 导致 undefined is not a function 报错
          const speedModalPath = "apps/mobile/src/components/modals/player/PlaybackSpeedModal.tsx";
          if (fs.existsSync(speedModalPath)) {
            const speedModalCode = [
              "import { Orpheus } from '@bbplayer/orpheus'",
              "import { useEffect, useMemo, useRef, useState } from 'react'",
              "import { PanResponder, Pressable, StyleSheet, View } from 'react-native'",
              "import { Dialog, Text, useTheme } from 'react-native-paper'",
              "",
              "import Button from '@/components/common/Button'",
              "import { useModalStore } from '@/hooks/stores/useModalStore'",
              "import { toastAndLogError } from '@/utils/error-handling'",
              "",
              "const MIN_SPEED = 0.5",
              "const MAX_SPEED = 3.0",
              "const PRESET_SPEEDS = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 3.0]",
              "",
              "const roundSpeed = (value: number) => Math.round(value * 100) / 100",
              "",
              "const PlaybackSpeedModal = () => {",
              "  const theme = useTheme()",
              "  const close = useModalStore((state) => state.close)",
              "  const [speed, setSpeed] = useState<number>(1.0)",
              "  const [sliderWidth, setSliderWidth] = useState<number>(0)",
              "  const committedSpeedRef = useRef(1.0)",
              "  const pendingSpeedRef = useRef(1.0)",
              "",
              "  useEffect(() => {",
              "    if (typeof Orpheus?.getPlaybackSpeed === 'function') {",
              "      void Orpheus.getPlaybackSpeed()",
              "        .then((currentSpeed) => {",
              "          const s = typeof currentSpeed === 'number' && !isNaN(currentSpeed) ? currentSpeed : 1.0",
              "          committedSpeedRef.current = s",
              "          pendingSpeedRef.current = s",
              "          setSpeed(s)",
              "        })",
              "        .catch(() => {})",
              "    }",
              "",
              "    if (typeof Orpheus?.addListener === 'function') {",
              "      const subscription = Orpheus.addListener(",
              "        'onPlaybackSpeedChanged',",
              "        (event: { speed: number }) => {",
              "          if (typeof event?.speed === 'number' && !isNaN(event.speed)) {",
              "            committedSpeedRef.current = event.speed",
              "            pendingSpeedRef.current = event.speed",
              "            setSpeed(event.speed)",
              "          }",
              "        },",
              "      )",
              "      return () => subscription?.remove?.()",
              "    }",
              "  }, [])",
              "",
              "  const commitSpeed = async (newSpeed: number) => {",
              "    try {",
              "      const clampedSpeed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, newSpeed))",
              "      if (typeof Orpheus?.setPlaybackSpeed === 'function') {",
              "        await Orpheus.setPlaybackSpeed(clampedSpeed)",
              "      }",
              "      committedSpeedRef.current = clampedSpeed",
              "      pendingSpeedRef.current = clampedSpeed",
              "      setSpeed(clampedSpeed)",
              "    } catch (e) {",
              "      setSpeed(committedSpeedRef.current)",
              "      toastAndLogError('设置播放速度失败', e, 'Modal.PlaybackSpeed')",
              "    }",
              "  }",
              "",
              "  const handleValueChange = (value: number) => {",
              "    const roundedSpeed = roundSpeed(value)",
              "    pendingSpeedRef.current = roundedSpeed",
              "    setSpeed(roundedSpeed)",
              "  }",
              "",
              "  const handleReset = () => {",
              "    pendingSpeedRef.current = 1.0",
              "    setSpeed(1.0)",
              "    void commitSpeed(1.0)",
              "  }",
              "",
              "  const panResponder = useMemo(",
              "    () =>",
              "      PanResponder.create({",
              "        onStartShouldSetPanResponder: () => true,",
              "        onMoveShouldSetPanResponder: () => true,",
              "        onPanResponderGrant: (evt) => {",
              "          const locationX = evt.nativeEvent.locationX",
              "          const fraction = Math.max(0, Math.min(1, locationX / (sliderWidth || 1)))",
              "          const actualVal = MIN_SPEED + fraction * (MAX_SPEED - MIN_SPEED)",
              "          handleValueChange(actualVal)",
              "        },",
              "        onPanResponderMove: (evt) => {",
              "          const locationX = evt.nativeEvent.locationX",
              "          const fraction = Math.max(0, Math.min(1, locationX / (sliderWidth || 1)))",
              "          const actualVal = MIN_SPEED + fraction * (MAX_SPEED - MIN_SPEED)",
              "          handleValueChange(actualVal)",
              "        },",
              "        onPanResponderRelease: () => {",
              "          void commitSpeed(pendingSpeedRef.current)",
              "        },",
              "      }),",
              "    [sliderWidth],",
              "  )",
              "",
              "  const progressRatio = Math.max(0, Math.min(1, (speed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)))",
              "",
              "  return (",
              "    <>",
              "      <Dialog.Title>播放速度</Dialog.Title>",
              "      <Dialog.Content>",
              "        <View style={styles.headerContainer}>",
              "          <Text variant='headlineMedium' style={styles.speedDisplay}>",
              "            当前: {speed.toFixed(2)}x",
              "          </Text>",
              "        </View>",
              "",
              "        <View style={styles.presetsContainer}>",
              "          {PRESET_SPEEDS.map((preset) => {",
              "            const isSelected = Math.abs(speed - preset) < 0.03",
              "            return (",
              "              <Pressable",
              "                key={preset}",
              "                onPress={() => void commitSpeed(preset)}",
              "                style={[",
              "                  styles.presetButton,",
              "                  {",
              "                    backgroundColor: isSelected",
              "                      ? theme.colors.primary",
              "                      : theme.colors.surfaceVariant,",
              "                  },",
              "                ]}",
              "              >",
              "                <Text",
              "                  style={[",
              "                    styles.presetText,",
              "                    {",
              "                      color: isSelected",
              "                        ? theme.colors.onPrimary",
              "                        : theme.colors.onSurfaceVariant,",
              "                      fontWeight: isSelected ? 'bold' : 'normal',",
              "                    },",
              "                  ]}",
              "                >",
              "                  {preset}x",
              "                </Text>",
              "              </Pressable>",
              "            )",
              "          })}",
              "        </View>",
              "",
              "        <View",
              "          style={styles.sliderContainer}",
              "          onLayout={(e) => setSliderWidth(e.nativeEvent.layout.width)}",
              "          {...panResponder.panHandlers}",
              "        >",
              "          <View style={[styles.trackInactive, { backgroundColor: theme.colors.surfaceVariant }]}>",
              "            <View style={[styles.trackActive, { width: `${progressRatio * 100}%`, backgroundColor: theme.colors.primary }]} />",
              "          </View>",
              "          <View style={[styles.thumb, { left: `${progressRatio * 100}%`, backgroundColor: theme.colors.primary }]} />",
              "        </View>",
              "        <View style={styles.rangeLabels}>",
              "          <Text variant='bodySmall' style={{ color: theme.colors.onSurfaceVariant }}>{MIN_SPEED}x</Text>",
              "          <Text variant='bodySmall' style={{ color: theme.colors.onSurfaceVariant }}>{MAX_SPEED}x</Text>",
              "        </View>",
              "      </Dialog.Content>",
              "      <Dialog.Actions>",
              "        <Button onPress={handleReset}>重置</Button>",
              "        <Button onPress={() => close('PlaybackSpeed')}>关闭</Button>",
              "      </Dialog.Actions>",
              "    </>",
              "  )",
              "}",
              "",
              "const styles = StyleSheet.create({",
              "  headerContainer: { alignItems: 'center', marginBottom: 16 },",
              "  speedDisplay: { fontWeight: 'bold' },",
              "  presetsContainer: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'center', gap: 8, marginBottom: 20 },",
              "  presetButton: { paddingHorizontal: 12, paddingVertical: 6, borderRadius: 16 },",
              "  presetText: { fontSize: 13 },",
              "  sliderContainer: { height: 40, justifyContent: 'center', paddingHorizontal: 10 },",
              "  trackInactive: { height: 6, borderRadius: 3, width: '100%', overflow: 'hidden' },",
              "  trackActive: { height: '100%', borderRadius: 3 },",
              "  thumb: { position: 'absolute', top: '50%', width: 20, height: 20, borderRadius: 10, marginTop: -10, shadowColor: '#000', shadowOffset: { width: 0, height: 2 }, shadowOpacity: 0.25, shadowRadius: 3, elevation: 4 },",
              "  rangeLabels: { flexDirection: 'row', justifyContent: 'space-between', paddingHorizontal: 10, marginTop: 4 },",
              "})",
              "",
              "export default PlaybackSpeedModal"
            ].join("\n");
            fs.writeFileSync(speedModalPath, speedModalCode, "utf8");
            console.log("✅ 已成功将 PlaybackSpeedModal.tsx 改造为原生全平台平滑倍速触控组件与预设切换组");
          }

          // 10. 防御性修复 @expo/ui/jetpack-compose colors：避免在 iOS 端调用未定义的 ExpoUIModule.getMaterialColors
          try {
            const uiPkg = require.resolve("@expo/ui/package.json", { paths: ["apps/mobile"] });
            const colorsPath = path.join(path.dirname(uiPkg), "src/jetpack-compose/colors.ts");
            if (fs.existsSync(colorsPath)) {
              let colorsCode = fs.readFileSync(colorsPath, "utf8");
              if (colorsCode.includes("return ExpoUIModule.getMaterialColors(options ?? null);")) {
                colorsCode = colorsCode.replace(
                  "return ExpoUIModule.getMaterialColors(options ?? null);",
                  "return (typeof ExpoUIModule?.getMaterialColors === 'function') ? ExpoUIModule.getMaterialColors(options ?? null) : ({} as any);"
                );
                colorsCode = colorsCode.replace(
                  "palette = ExpoUIModule.getMaterialColors(options) as MaterialColors;",
                  "palette = (typeof ExpoUIModule?.getMaterialColors === 'function') ? ExpoUIModule.getMaterialColors(options) as MaterialColors : ({} as any);"
                );
                fs.writeFileSync(colorsPath, colorsCode, "utf8");
                console.log("✅ 已为 @expo/ui/jetpack-compose/colors.ts 注入 getMaterialColors 安全守卫");
              }
            }
          } catch (e) {
            console.warn("⚠️ @expo/ui colors 防御修补警告:", e.message);
          }

          // 11. 开启 iOS 灵动岛系统动画、后台控制与音频中断互斥联动：
          // (a) 在主线程调用 UIApplication.shared.beginReceivingRemoteControlEvents() 注册系统控制权；
          // (b) 每次播放状态变化时，显式同步 MPNowPlayingInfoCenter.default().playbackState (.playing / .paused)，
          //     配置 longFormAudio 与 setActive(true)，使 SpringBoard 识别前台 App 为活跃音频源，在向上滑动返回桌面时触发“飞入灵动岛”系统级流体动画；
          // (c) 在 play()、pause() 和 loadAvPlayerItem 中保持音频会话激活与实时更新状态；
          // (d) 在其他应用播放音频时互斥暂停，关闭联动时保留混音后台播放。
          const playerMgrPath = "packages/orpheus/ios/OrpheusPlayerManager.swift";
          if (fs.existsSync(playerMgrPath)) {
            let playerMgr = fs.readFileSync(playerMgrPath, "utf8");
            if (!playerMgr.includes("setAllowSimultaneousPlayback")) {
              const systemIntegrationPattern = /\/\/ MARK: - System Integration[\s\S]*?(?=private func downloadImage\(url: URL)/;
              if (systemIntegrationPattern.test(playerMgr)) {
                const newSystemIntegrationBlock = [
                  '// MARK: - System Integration',
                  '    ',
                  '    private var isSimultaneousPlaybackAllowed = false',
                  '    private var enableSystemMediaControl: Bool = true',
                  '',
                  '    func setAllowSimultaneousPlayback(_ enabled: Bool) {',
                  '        isSimultaneousPlaybackAllowed = enabled',
                  '        enableSystemMediaControl = !enabled',
                  '        setupAudioSession()',
                  '        if enabled {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '        } else {',
                  '            updateNowPlayingInfo()',
                  '        }',
                  '    }',
                  '',
                  '    private func setupAudioSession() {',
                  '        do {',
                  '            let session = AVAudioSession.sharedInstance()',
                  '            let options: AVAudioSession.CategoryOptions = isSimultaneousPlaybackAllowed ? [.mixWithOthers] : []',
                  '            if isSimultaneousPlaybackAllowed {',
                  '                try session.setCategory(.playback, mode: .default, options: options)',
                  '            } else {',
                  '                try session.setCategory(.playback, mode: .default, options: options)',
                  '            }',
                  '            try session.setActive(true)',
                  '            NotificationCenter.default.removeObserver(self, name: AVAudioSession.interruptionNotification, object: session)',
                  '            NotificationCenter.default.addObserver(self, selector: #selector(handleInterruption), name: AVAudioSession.interruptionNotification, object: session)',
                  '        } catch {',
                  '',
                  '        }',
                  '    }',
                  '    ',
                  '    @objc private func handleInterruption(notification: Notification) {',
                  '        if isSimultaneousPlaybackAllowed {',
                  '            return',
                  '        }',
                  '        guard let userInfo = notification.userInfo,',
                  '              let typeValue = userInfo[AVAudioSessionInterruptionTypeKey] as? UInt,',
                  '              let type = AVAudioSession.InterruptionType(rawValue: typeValue) else { return }',
                  '        ',
                  '        if type == .began {',
                  '            DispatchQueue.main.async { [weak self] in',
                  '                self?.pause()',
                  '            }',
                  '        } else if type == .ended {',
                  '            if let optionsValue = userInfo[AVAudioSessionInterruptionOptionKey] as? UInt {',
                  '                let options = AVAudioSession.InterruptionOptions(rawValue: optionsValue)',
                  '                if options.contains(.shouldResume) {',
                  '                    DispatchQueue.main.async { [weak self] in',
                  '                        self?.play()',
                  '                    }',
                  '                }',
                  '            }',
                  '        }',
                  '    }',
                  '    ',
                  '    private func setupRemoteCommands() {',
                  '        DispatchQueue.main.async {',
                  '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                  '        }',
                  '        let commandCenter = MPRemoteCommandCenter.shared()',
                  '        ',
                  '        commandCenter.togglePlayPauseCommand.isEnabled = true',
                  '        commandCenter.playCommand.isEnabled = true',
                  '        commandCenter.pauseCommand.isEnabled = true',
                  '        commandCenter.nextTrackCommand.isEnabled = true',
                  '        commandCenter.previousTrackCommand.isEnabled = true',
                  '        commandCenter.changePlaybackPositionCommand.isEnabled = true',
                  '        ',
                  '        commandCenter.togglePlayPauseCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            if self.isPlaying() {',
                  '                self.pause()',
                  '            } else {',
                  '                self.play()',
                  '            }',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.playCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.play()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.pauseCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.pause()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.nextTrackCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.playNext()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.previousTrackCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.skipToPrevious()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.changePlaybackPositionCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            if let event = event as? MPChangePlaybackPositionCommandEvent {',
                  '                self.seek(to: event.positionTime)',
                  '                return .success',
                  '            }',
                  '            return .commandFailed',
                  '        }',
                  '    }',
                  '    ',
                  '    private func updateNowPlayingInfo() {',
                  '        guard enableSystemMediaControl && !isSimultaneousPlaybackAllowed else {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '            return',
                  '        }',
                  '        guard let track = getCurrentTrack() else {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '            return',
                  '        }',
                  '        ',
                  '        let isPlayingState = (self.player.timeControlStatus == .playing || self.player.timeControlStatus == .waitingToPlayAtSpecifiedRate || self.player.rate > 0 || self.isPlaying())',
                  '        let playbackRate: Double = isPlayingState ? (self.player.rate > 0 ? Double(self.player.rate) : 1.0) : 0.0',
                  '        ',
                  '        var info: [String: Any] = [',
                  '            MPMediaItemPropertyTitle: track.title ?? "Unknown Title",',
                  '            MPMediaItemPropertyArtist: track.artist ?? "Unknown Artist",',
                  '            MPNowPlayingInfoPropertyElapsedPlaybackTime: player.currentTime().seconds,',
                  '            MPNowPlayingInfoPropertyPlaybackRate: playbackRate,',
                  '            MPNowPlayingInfoPropertyDefaultPlaybackRate: 1.0,',
                  '            MPNowPlayingInfoPropertyPlaybackQueueIndex: queueManager.getCurrentIndex(),',
                  '            MPNowPlayingInfoPropertyPlaybackQueueCount: queueManager.getQueueCount()',
                  '        ]',
                  '        ',
                  '        if let duration = track.duration, duration > 0 {',
                  '             info[MPMediaItemPropertyPlaybackDuration] = duration',
                  '        } else if let playerDuration = player.currentItem?.duration.seconds, !playerDuration.isNaN, playerDuration > 0 {',
                  '             info[MPMediaItemPropertyPlaybackDuration] = playerDuration',
                  '        }',
                  '        ',
                  '        if let artworkUrlStr = track.artwork {',
                  '            if let cached = imageCache.object(forKey: artworkUrlStr as NSString) {',
                  '                let artwork = MPMediaItemArtwork(boundsSize: cached.size) { _ in cached }',
                  '                info[MPMediaItemPropertyArtwork] = artwork',
                  '            } else if let artworkUrl = URL(string: artworkUrlStr) {',
                  '                downloadImage(url: artworkUrl) { [weak self] image in',
                  '                    guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return }',
                  '                    guard let image = image else { return }',
                  '                    self.imageCache.setObject(image, forKey: artworkUrlStr as NSString)',
                  '                    DispatchQueue.main.async {',
                  '                        if var currentInfo = MPNowPlayingInfoCenter.default().nowPlayingInfo {',
                  '                            if currentInfo[MPMediaItemPropertyTitle] as? String == track.title {',
                  '                                 let artwork = MPMediaItemArtwork(boundsSize: image.size) { _ in image }',
                  '                                 currentInfo[MPMediaItemPropertyArtwork] = artwork',
                  '                                 MPNowPlayingInfoCenter.default().nowPlayingInfo = currentInfo',
                  '                            }',
                  '                        } else {',
                  '                            info[MPMediaItemPropertyArtwork] = MPMediaItemArtwork(boundsSize: image.size) { _ in image }',
                  '                            MPNowPlayingInfoCenter.default().nowPlayingInfo = info',
                  '                        }',
                  '                    }',
                  '                }',
                  '            }',
                  '        }',
                  '        ',
                  '        MPNowPlayingInfoCenter.default().nowPlayingInfo = info',
                  '        MPNowPlayingInfoCenter.default().playbackState = isPlayingState ? .playing : .paused',
                  '    }',
                  '    \n    '
                ].join("\n");
                playerMgr = playerMgr.replace(systemIntegrationPattern, newSystemIntegrationBlock);
              }
              const playPausePattern = /player\.play\(\)\s*\}\s*func pause\(\)\s*\{\s*player\.pause\(\)\s*\}/;
              if (playPausePattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(playPausePattern, [
                  'setupAudioSession()',
                  '        DispatchQueue.main.async {',
                  '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                  '        }',
                  '        player.play()',
                  '        updateNowPlayingInfo()',
                  '    }',
                  '    ',
                  '    func pause() {',
                  '        player.pause()',
                  '        if enableSystemMediaControl && !isSimultaneousPlaybackAllowed {',
                  '            MPNowPlayingInfoCenter.default().playbackState = .paused',
                  '        }',
                  '        updateNowPlayingInfo()',
                  '    }'
                ].join("\n"));
              }
              const replaceItemPattern = /player\.replaceCurrentItem\(with: item\)[\s\S]*?player\.play\(\)/;
              if (replaceItemPattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(
                  replaceItemPattern,
                  [
                    'setupAudioSession()',
                    '        DispatchQueue.main.async {',
                    '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                    '        }',
                    '        player.replaceCurrentItem(with: item)',
                    '        if let startPos = startPosition, startPos > 0 {',
                    '             let time = CMTime(seconds: startPos, preferredTimescale: 1000)',
                    '             player.seek(to: time, toleranceBefore: .zero, toleranceAfter: .zero)',
                    '        }',
                    '        player.play()',
                    '        updateNowPlayingInfo()'
                  ].join("\n")
                );
              }
              fs.writeFileSync(playerMgrPath, playerMgr, "utf8");
              console.log("✅ 已配置 OrpheusPlayerManager.swift 支持系统灵动岛飞入动画与 NowPlaying 同步");
            }
          }

