name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动一键触发构建
  push:
    branches:
      - master
      - main
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build Unsigned IPA
    # 关键修复 1：必须使用 macos-26 (Apple Silicon arm64，默认预装 Xcode 26.6 / Build 17F113 / Swift 6.3.3 / iOS 26.5 Runtime)
    # 原因：
    # 1) 项目启用的 @rnrepo/expo-config-plugin 预编译 xcframework 产物均由 Xcode 26.6 (17F113, Swift 6.3.3, iphoneos26.5) 编译，
    #    在 macos-15 (Xcode 16.4 / Swift 6.1 或最高 Xcode 26.3 / Swift 6.2) 上会因编译器与 SDK 版本过旧导致编译失败 (exit code 65)。
    # 2) macos-26 默认自带与 Xcode 26.6 完全匹配的 iOS 26.5 Simulator Runtime，actool 编译 Assets.xcassets 不会再报版本不匹配。
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: 🏗️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史以便 app.config.ts 计算 git commit 数量作为 versionCode

      - name: 🍎 校验并选择与 Simulator Runtime 精确匹配的 Xcode
        run: |
          echo "=== Runner 已安装的 Xcode 列表 ==="
          ls -d /Applications/Xcode*.app

          echo "=== Runner 已安装的 Simulator Runtimes ==="
          xcrun simctl list runtimes -v || true

          # 提取已安装的 Simulator Runtime Build 版本号集合
          INSTALLED_RUNTIMES=$(xcrun simctl list runtimes | grep -oE '[0-9]{2}[A-Z][0-9A-Za-z]+' || true)

          # 先检查当前默认 Xcode 的 SDKSettings.plist 是否已精确匹配 Runtime
          CURRENT_SDK_BUILD=$(xcrun --sdk iphonesimulator --show-sdk-build-version 2>/dev/null || echo "")
          echo "当前默认 Xcode iphonesimulator SDK Build: $CURRENT_SDK_BUILD"

          if [ -z "$CURRENT_SDK_BUILD" ] || ! echo "$INSTALLED_RUNTIMES" | grep -qx "$CURRENT_SDK_BUILD"; then
            echo "默认 Xcode SDK ($CURRENT_SDK_BUILD) 未精确匹配 Runtime，开始从高到低自动搜索匹配的 Xcode..."
            for xcode in $(ls -d /Applications/Xcode_*.app | sort -V -r); do
              SDK_SETTINGS="$xcode/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/SDKSettings.plist"
              if [ -f "$SDK_SETTINGS" ]; then
                SDK_BUILD=$(/usr/libexec/PlistBuddy -c "Print :DefaultProperties:BUILD_VERSION" "$SDK_SETTINGS" 2>/dev/null || echo "")
                echo "检查 $xcode -> SDK Build: $SDK_BUILD"
                if [ -n "$SDK_BUILD" ] && echo "$INSTALLED_RUNTIMES" | grep -qx "$SDK_BUILD"; then
                  echo "✅ 切换至与 Simulator Runtime ($SDK_BUILD) 100% 匹配的 Xcode: $xcode"
                  sudo xcode-select -s "$xcode/Contents/Developer"
                  break
                fi
              fi
            done
          else
            echo "✅ 当前默认 Xcode 已与已安装的 Simulator Runtime ($CURRENT_SDK_BUILD) 100% 匹配"
          fi

          xcodebuild -version
          xcrun swiftc -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-build-version

      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📥 安装依赖
        env:
          LEFTHOOK: "0" # 跳过 Git Hook 安装
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🩹 修复 ExpoOrpheus 在 iOS 26 SDK / Swift 6.3 下的编译错误
        run: |
          node << 'EOF'
          const fs = require("fs");

          // 1. 修复 AudioSpectrumAnalyzer.swift：
          // iOS 26 SDK 为 MTAudioProcessingTapCreate 添加了 CF_RETURNS_RETAINED 注解，
          // 第 4 个参数从 UnsafeMutablePointer<Unmanaged<MTAudioProcessingTap>?> 变为 UnsafeMutablePointer<MTAudioProcessingTap?>
          const analyzerPath = "packages/orpheus/ios/AudioSpectrumAnalyzer.swift";
          let analyzer = fs.readFileSync(analyzerPath, "utf8");
          const tapPattern = /var tap: Unmanaged<MTAudioProcessingTap>\?[\s\S]*?return tap\?\.takeRetainedValue\(\)\s*\}/;
          if (tapPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              tapPattern,
          `#if compiler(>=6.2)
                  var tap: MTAudioProcessingTap?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap
                  }
                  #else
                  var tap: Unmanaged<MTAudioProcessingTap>?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap?.takeRetainedValue()
                  }
                  #endif`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 MTAudioProcessingTapCreate 类型签名");
          } else if (!analyzer.includes("#if compiler(>=6.2)")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 MTAudioProcessingTapCreate 代码块");
          }

          // 同时修复 DSPSplitComplex 临时指针作用域与 vDSP_vsmul(&magnitudes, ..., &magnitudes, ...) 的 Swift 内存独占访问冲突 (overlapping accesses to 'magnitudes')
          const dspPattern = /var splitComplex = DSPSplitComplex\(realp: &realOut, imagp: &imagOut\)[\s\S]*?vDSP_vsmul\(&magnitudes, 1, &scale, &magnitudes, 1, vDSP_Length\(fftSize\)\)/;
          if (dspPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              dspPattern,
          `var scale = 1.0 / Float(fftSize)
                  realOut.withUnsafeMutableBufferPointer { realPtr in
                      imagOut.withUnsafeMutableBufferPointer { imagPtr in
                          magnitudes.withUnsafeMutableBufferPointer { magPtr in
                              guard let realBase = realPtr.baseAddress,
                                    let imagBase = imagPtr.baseAddress,
                                    let magBase = magPtr.baseAddress else { return }
                              var splitComplex = DSPSplitComplex(realp: realBase, imagp: imagBase)
                              vDSP_zvabs(&splitComplex, 1, magBase, 1, vDSP_Length(fftSize))
                              vDSP_vsmul(magBase, 1, &scale, magBase, 1, vDSP_Length(fftSize))
                          }
                      }
                  }`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 DSPSplitComplex 指针作用域与 vDSP_vsmul 内存独占访问冲突");
          } else if (!analyzer.includes("vDSP_vsmul(magBase")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 DSPSplitComplex / vDSP_vsmul 代码块");
          }
          fs.writeFileSync(analyzerPath, analyzer, "utf8");

          // 2. 修复 ExpoOrpheusModule.swift：
          // (a) 多语句 .set 闭包无法自动推断泛型参数 $0 的类型，需显式声明 (enabled: Bool) in
          const modulePath = "packages/orpheus/ios/ExpoOrpheusModule.swift";
          let mod = fs.readFileSync(modulePath, "utf8");
          const propPattern = /Property\("isSpectrumVisualizerEnabled"\)\s*\.get\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled\s*\}\s*\.set\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled = \$0\s*self\.sendEvent\("onSpectrumVisualizerEnabledChanged", \["enabled": \$0\]\)\s*\}/;
          if (propPattern.test(mod)) {
            mod = mod.replace(
              propPattern,
          `Property("isSpectrumVisualizerEnabled")
                      .get { GeneralStorage.shared.isSpectrumVisualizerEnabled }
                      .set { (enabled: Bool) in
                          GeneralStorage.shared.isSpectrumVisualizerEnabled = enabled
                          self.sendEvent("onSpectrumVisualizerEnabledChanged", ["enabled": enabled])
                      }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 isSpectrumVisualizerEnabled .set 闭包类型注解");
          } else if (!mod.includes("(enabled: Bool) in")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 isSpectrumVisualizerEnabled 代码块");
          }

          // (b) 修复 updateSpectrumData 中不存在的 TypedArray.getUnsafeMutablePointer 方法，
          // 改用 ExpoModulesCore 标准公开属性 destination.rawPointer.bindMemory(to:capacity:)
          const spectrumPattern = /Function\("updateSpectrumData"\)\s*\{\s*\(destination:\s*TypedArray\)\s*in[\s\S]*?fillSpectrumData\(destination:\s*ptr,\s*count:\s*count\)\s*\}\s*\}/;
          if (spectrumPattern.test(mod)) {
            mod = mod.replace(
              spectrumPattern,
          `Function("updateSpectrumData") { (destination: TypedArray) in
                  let count = destination.length
                  guard count > 0, destination.byteLength >= count * MemoryLayout<Float32>.stride else { return }
                  let ptr = destination.rawPointer.bindMemory(to: Float32.self, capacity: count)
                  AudioSpectrumAnalyzer.shared.fillSpectrumData(destination: ptr, count: count)
              }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 updateSpectrumData TypedArray 指针调用");
          } else if (!mod.includes("destination.rawPointer.bindMemory")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 updateSpectrumData 代码块");
          }
          fs.writeFileSync(modulePath, mod, "utf8");
          EOF

      - name: 🩹 修复 iOS 运行时闪退与组件异常 (UIAppFonts 缺失、TabLayout 异常防护与 ExpoSharing 兼容)
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          // 1. 修复 TabLayout 模块加载时的同步原生调用异常：
          // 原代码直接在顶层常量中调用 Icon.getImageSourceSync，若字体初始化稍有延迟或缺失会直接抛出原生未捕获异常，
          // 导致 Metro require 该文件返回 undefined，Expo Router 解构 ErrorBoundary 崩溃 (Cannot read property 'ErrorBoundary' of undefined)。
          // 引入 getSafeIcon 防御性封装，在捕获到任何异常时优雅回退为默认图标对象。
          const layoutPath = "apps/mobile/src/app/(tabs)/_layout.tsx";
          if (fs.existsSync(layoutPath)) {
            let layout = fs.readFileSync(layoutPath, "utf8");
            const iconPattern = /const searchIcon = Icon\.getImageSourceSync\('magnify', 24\)[\s\S]*?const profileIcon = Icon\.getImageSourceSync\('account', 24\) as nonNullableIcon/;
            if (iconPattern.test(layout)) {
              const safeIconBlock = [
                "const getSafeIcon = (glyph: string, size = 24): nonNullableIcon => {",
                "  try {",
                "    const icon = Icon.getImageSourceSync(glyph, size) as nonNullableIcon",
                "    if (icon && icon.uri) return icon",
                "  } catch (e) {",
                "    console.warn('[TabLayout] getImageSourceSync failed for ' + glyph, e)",
                "  }",
                "  return { uri: '', scale: 1 }",
                "}",
                "",
                "const searchIcon = getSafeIcon('magnify', 24)",
                "const libraryIcon = getSafeIcon('bookshelf', 24)",
                "const profileIcon = getSafeIcon('account', 24)"
              ].join("\n");
              layout = layout.replace(iconPattern, safeIconBlock);
              fs.writeFileSync(layoutPath, layout, "utf8");
              console.log("✅ 已成功为 (tabs)/_layout.tsx 注入安全的 getSafeIcon 异常防护");
            }
          }

          // 2. 修复 app.config.ts：声明 UIAppFonts (MaterialDesignIcons.ttf) 与 ExpoShareIntoAppGroupId
          // 解决 iOS 运行时无法加载字体导致 VectorIcons.mm 抛出 NSException 的根本原因，以及解决 useIncomingShare 缺失 App Group 报错。
          const configPath = "apps/mobile/app.config.ts";
          if (fs.existsSync(configPath)) {
            let cfg = fs.readFileSync(configPath, "utf8");
            const iosPattern = /(\bios:\s*\{[\r\n\s]*bundleIdentifier:)/;
            if (iosPattern.test(cfg)) {
              const iosBlock = [
                "ios: {",
                "      infoPlist: {",
                "        UIAppFonts: ['MaterialDesignIcons.ttf'],",
                "        ExpoShareIntoAppGroupId: 'group.com.roitium.bbplayer',",
                "      },",
                "      bundleIdentifier:"
              ].join("\n");
              cfg = cfg.replace(iosPattern, iosBlock);
              fs.writeFileSync(configPath, cfg, "utf8");
              console.log("✅ 已向 app.config.ts 注入 UIAppFonts 与 ExpoShareIntoAppGroupId");
            }
          }
              );
              fs.writeFileSync(configPath, cfg, "utf8");
              console.log("✅ 已向 app.config.ts 注入 UIAppFonts 与 ExpoShareIntoAppGroupId");
            }
          }

          // 3. 防御性修复 expo-sharing：避免缺失 App Group 时抛出 FailedToResolveAppGroupIdException 导致首页崩溃
          try {
            const sharePkg = require.resolve("expo-sharing/package.json", { paths: ["apps/mobile"] });
            const shareDir = path.dirname(sharePkg);

            // 修补 JS 端 useIncomingShare hook：避免顶层 useState(getSharedPayloads()) 同步抛错
            const hookPath = path.join(shareDir, "build/useIncomingShare.js");
            if (fs.existsSync(hookPath)) {
              let hook = fs.readFileSync(hookPath, "utf8");
              if (hook.includes("useState(getSharedPayloads())")) {
                hook = hook.replace("useState(getSharedPayloads())", "useState(() => { try { return getSharedPayloads(); } catch (e) { return []; } })");
                fs.writeFileSync(hookPath, hook, "utf8");
                console.log("✅ 已修补 expo-sharing/useIncomingShare.js");
              }
            }

            // 修补原生端 SharingModule.swift：未配置 App Group 时优雅返回，避免中断执行
            const swiftPath = path.join(shareDir, "ios/SharingModule.swift");
            if (fs.existsSync(swiftPath)) {
              let swift = fs.readFileSync(swiftPath, "utf8");
              if (swift.includes("throw FailedToResolveAppGroupIdException()")) {
                swift = swift.replace("throw FailedToResolveAppGroupIdException()", `return Bundle.main.bundleIdentifier.map { "group." + $0 } ?? "group.com.roitium.bbplayer"`);
                fs.writeFileSync(swiftPath, swift, "utf8");
                console.log("✅ 已修补 expo-sharing/SharingModule.swift");
              }
            }
          } catch (e) {
            console.warn("⚠️ expo-sharing 防御修补警告:", e.message);
          }
          EOF

      - name: 📱 生成 iOS 原生工程 (Expo Prebuild)
        run: |
          set -o pipefail
          export VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Calculated VERSION_CODE=$VERSION_CODE"
          cd apps/mobile

          # 关键修复 2：将 react-native-screens 加入 RNRepo iOS 预编译黑名单 (denyList.ios)
          # 原因：RNRepo 预编译的 RNScreens.xcframework 仅包含文本格式的 .swiftinterface（无二进制 .swiftmodule），
          # 而 ExpoRouter (Swift) 在 import RNScreens 时会触发 swiftc 的 ModuleInterfaceLoader 启动隔离子编译器，
          # 该子编译器会强制剥离父进程的所有 -Xcc 参数（包括 -Xcc -ivfsoverlay React-VFS.yaml），导致 RNScreens 伞形头文件报错找不到 <React/RCTEventDispatcherProtocol.h>。
          # 将 react-native-screens 设为源码编译后，Expo 会将其编译为静态库并生成二进制 RNScreens.swiftmodule，彻底规避 .swiftinterface 子编译问题。
          node -e '
            const fs = require("fs");
            const cfgPath = "rnrepo.config.json";
            const cfg = fs.existsSync(cfgPath) ? JSON.parse(fs.readFileSync(cfgPath, "utf8")) : {};
            cfg.denyList = cfg.denyList || {};
            const iosDeny = new Set(Array.isArray(cfg.denyList.ios) ? cfg.denyList.ios : []);
            iosDeny.add("react-native-screens");
            cfg.denyList.ios = Array.from(iosDeny);
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n", "utf8");
            console.log("✅ 已配置 apps/mobile/rnrepo.config.json:", JSON.stringify(cfg));
          '

          # 必须带 --no-install，确保在注入 $RNFirebaseDisableSPM 之后再统一执行 pod install
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"

          # 关键修复：确保 Info.plist 中 100% 写入 UIAppFonts 与 ExpoShareIntoAppGroupId
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          function findPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findPlist(full);
                if (found) return found;
              } else if (f.name === "Info.plist") {
                return full;
              }
            }
            return null;
          }

          const plistPath = findPlist("ios") || findPlist("apps/mobile/ios");
          if (plistPath) {
            console.log("🔍 检查生成的 Info.plist:", plistPath);
            const content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("MaterialDesignIcons.ttf")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string MaterialDesignIcons.ttf" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIAppFonts (MaterialDesignIcons.ttf)");
            }
            if (!content.includes("ExpoShareIntoAppGroupId")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :ExpoShareIntoAppGroupId string group.com.roitium.bbplayer" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 ExpoShareIntoAppGroupId");
            }
          }
          EOF

      - name: 🍎 安装 CocoaPods 依赖
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios

          # 关键修复 3：在 Podfile 顶部安全注入 $RNFirebaseDisableSPM = true（避免用单行 sed 破坏多行语法）
          grep -q 'RNFirebaseDisableSPM' Podfile || {
            printf '%s\n%s\n' '$RNFirebaseDisableSPM = true' "$(cat Podfile)" > Podfile
          }

          pod install --repo-update 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"

          # 防御性检查：若未来 RNRepo 预编译产物的 Swift 主次版本高于当前 Runner 的 Swift 编译器，自动回退为源码编译
          if ! ruby -e '
            local = `xcrun swiftc -version`[/Apple Swift version (\d+\.\d+)/, 1]
            exit 0 unless local
            Dir.glob("../../../node_modules/**/.rnrepo-cache/**/*.swiftinterface").each do |f|
              pkg = File.read(f, 2048)[/-interface-compiler-version (\d+\.\d+)/, 1]
              if pkg && Gem::Version.new(pkg) > Gem::Version.new(local)
                puts "RNRepo Swift #{pkg} > Local Swift #{local} (#{f})"
                exit 1
              end
            end
          '; then
            echo "⚠️ 检测到 RNRepo 预编译包 Swift 版本高于当前 Xcode，自动切换为 DISABLE_RNREPO=1 源码安装..."
            DISABLE_RNREPO=1 pod install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          fi

          # 关键修复 4：修复 React-Core-prebuilt + useFrameworks: 'static' 在 Release 构建下的头文件与模块映射问题：
          # 1) 提前将 React-Core-prebuilt 切换至 Release 切片，防止 xcodebuild 阶段 replace-rncore-version.js 重新解压覆盖补丁。
          # 2) 将 React.xcframework 内部按子模块嵌套的头文件（如 Headers/React_Core/React/*.h、Headers/Yoga/yoga/*.h 等）
          #    实体化平铺到磁盘上的 React.xcframework/Headers/ 与各切片的 React.framework/Headers/ 中。
          #    这样即使 swiftc 在编译任何 .swiftinterface 子模块时剥离了 -Xcc -ivfsoverlay 虚拟文件系统参数，
          #    Clang 也能直接通过 -F (React.framework/Headers/*.h) 和原生 Swift -I 物理路径找到所有 <React/*.h> 与 <yoga/*.h> 头文件。
          # 3) 补齐被 expo-modules-autolinking 的 append_macro_flags 覆盖丢失的 .xcconfig 编译参数。
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const iosDir = process.cwd();
          const podsRoot = path.join(iosDir, "Pods");
          const prebuiltDir = path.join(podsRoot, "React-Core-prebuilt");
          const xcfwDir = path.join(prebuiltDir, "React.xcframework");

          function copyDirRecursive(srcDir, destDir) {
            let copied = 0;
            if (!fs.existsSync(srcDir)) return copied;
            for (const entry of fs.readdirSync(srcDir, { withFileTypes: true })) {
              const srcPath = path.join(srcDir, entry.name);
              const destPath = path.join(destDir, entry.name);
              if (entry.isDirectory()) {
                copied += copyDirRecursive(srcPath, destPath);
              } else if (entry.isFile() && !fs.existsSync(destPath)) {
                fs.mkdirSync(destDir, { recursive: true });
                fs.copyFileSync(srcPath, destPath);
                copied++;
              }
            }
            return copied;
          }

          function materializeReactHeaders(headersRoot, isFrameworkSlice) {
            if (!fs.existsSync(headersRoot)) return 0;
            let count = 0;
            const subdirs = fs.readdirSync(headersRoot, { withFileTypes: true }).filter((d) => d.isDirectory());
            // 将 Headers/<SubspecName>/<ModulePrefix>/... 实体化平铺到 Headers/<ModulePrefix>/...
            for (const sub of subdirs) {
              const subPath = path.join(headersRoot, sub.name);
              count += copyDirRecursive(subPath, headersRoot);
            }
            // 对于 React.framework/Headers 切片目录，Clang 通过 -F 查找 `#import <React/Foo.h>` 时
            // 会直接查找 `React.framework/Headers/Foo.h`，因此同步将 `Headers/React/*` 平铺到 `React.framework/Headers/*`
            if (isFrameworkSlice) {
              const reactSubdir = path.join(headersRoot, "React");
              if (fs.existsSync(reactSubdir)) {
                count += copyDirRecursive(reactSubdir, headersRoot);
              }
            }
            return count;
          }

          if (fs.existsSync(prebuiltDir)) {
            // 1. 提前将 React-Core-prebuilt 切换至 Release 切片并写入 .last_build_configuration = "Release"
            const rnPkgPath = require.resolve("react-native/package.json", { paths: [iosDir] });
            const rnDir = path.dirname(rnPkgPath);
            const rnVersion = JSON.parse(fs.readFileSync(rnPkgPath, "utf8")).version;
            const replaceScript = path.join(rnDir, "scripts", "replace-rncore-version.js");

            if (fs.existsSync(replaceScript)) {
              console.log(`🔄 预切换 React-Core-prebuilt (${rnVersion}) 至 Release 配置...`);
              execFileSync(
                process.execPath,
                [replaceScript, "-c", "Release", "-r", rnVersion, "-p", podsRoot],
                { cwd: podsRoot, stdio: "inherit" }
              );
            }

            // 2. 基于 Release 版 React.xcframework 重新生成 React-VFS.yaml
            const vfsTemplatePath = path.join(xcfwDir, "React-VFS-template.yaml");
            const vfsPath = path.join(prebuiltDir, "React-VFS.yaml");
            if (fs.existsSync(vfsTemplatePath)) {
              const vfsContent = fs
                .readFileSync(vfsTemplatePath, "utf8")
                .replace(/\$\{ROOT_PATH\}/g, () => xcfwDir);
              fs.writeFileSync(vfsPath, vfsContent, "utf8");
              console.log(`✅ 已同步更新 Release 版 VFS 映射: ${vfsPath}`);
            }

            // 3. 实体化平铺 React.xcframework 头文件到磁盘，消除对虚拟文件系统 (VFS) 的强依赖
            let materializedCount = materializeReactHeaders(path.join(xcfwDir, "Headers"), false);
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceHeaders = path.join(xcfwDir, entry.name, "React.framework", "Headers");
                  if (fs.existsSync(sliceHeaders)) {
                    materializedCount += materializeReactHeaders(sliceHeaders, true);
                  }
                }
              }
            }
            console.log(`✅ 已实体化平铺 ${materializedCount} 个 React.xcframework 头文件到物理磁盘`);

            // 4. 重新对 Release 版 React.xcframework 应用 Expo 的 modulemap 补丁：
            //    移除 `framework module React { ... }`（保留 `React_RCTAppDelegate`）
            const fwModuleReactRegex = /framework module React \{[\s\S]*?\n\}\s*/g;
            const modulemapPaths = [path.join(xcfwDir, "Modules", "module.modulemap")];
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceMap = path.join(xcfwDir, entry.name, "React.framework", "Modules", "module.modulemap");
                  if (fs.existsSync(sliceMap)) modulemapPaths.push(sliceMap);
                }
              }
            }
            for (const mmPath of modulemapPaths) {
              if (fs.existsSync(mmPath)) {
                const orig = fs.readFileSync(mmPath, "utf8");
                const patched = orig.replace(fwModuleReactRegex, "");
                if (patched !== orig) {
                  fs.writeFileSync(mmPath, patched, "utf8");
                  console.log(`✅ 已修补 modulemap (移除 framework module React): ${path.relative(podsRoot, mmPath)}`);
                }
              }
            }

            // 5. 遍历 Target Support Files 下所有 .xcconfig，补齐 React-VFS.yaml、modulemap 以及原生 Swift -I 搜索路径
            const targetSupportDir = path.join(podsRoot, "Target Support Files");
            const useFwModulemap = path.join(targetSupportDir, "React-Core-prebuilt", "React-use-frameworks.modulemap");
            const hasUseFwModulemap = fs.existsSync(useFwModulemap);

            if (fs.existsSync(vfsPath) && fs.existsSync(targetSupportDir)) {
              const cVfsFlag = `-ivfsoverlay "${vfsPath}"`;
              const swiftVfsFlag = `-I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
              const cUseFwFlags = `-isystem "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;
              const swiftUseFwFlags = `-Xcc -isystem -Xcc "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;

              function walkXcconfigs(dir, out = []) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walkXcconfigs(full, out);
                  else if (entry.isFile() && entry.name.endsWith(".xcconfig")) out.push(full);
                }
                return out;
              }

              let patchedCount = 0;
              for (const xcconfigPath of walkXcconfigs(targetSupportDir)) {
                let content = fs.readFileSync(xcconfigPath, "utf8");
                let changed = false;

                for (const key of ["OTHER_CFLAGS", "OTHER_CPLUSPLUSFLAGS"]) {
                  const re = new RegExp(`^(${key}\\s*=\\s*)(.*)$`, "m");
                  const m = content.match(re);
                  if (m) {
                    let extra = "";
                    if (!m[2].includes("React-VFS.yaml")) extra += ` ${cVfsFlag}`;
                    if (hasUseFwModulemap && !m[2].includes("React-use-frameworks.modulemap")) extra += ` ${cUseFwFlags}`;
                    if (extra) {
                      content = content.replace(re, (_, p, v) => `${p}${v}${extra}`);
                      changed = true;
                    }
                  } else {
                    const extra = `${cVfsFlag}${hasUseFwModulemap ? " " + cUseFwFlags : ""}`;
                    content = content.trimEnd() + `\n${key} = $(inherited) ${extra}\n`;
                    changed = true;
                  }
                }

                const swiftRe = /^(OTHER_SWIFT_FLAGS\s*=\s*)(.*)$/m;
                const sm = content.match(swiftRe);
                if (sm) {
                  let extra = "";
                  if (!sm[2].includes("-I \"${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers\"")) {
                    extra += ` -I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers"`;
                  }
                  if (!sm[2].includes("React-VFS.yaml")) extra += ` -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
                  if (hasUseFwModulemap && !sm[2].includes("React-use-frameworks.modulemap")) extra += ` ${swiftUseFwFlags}`;
                  if (extra) {
                    content = content.replace(swiftRe, (_, p, v) => `${p}${v}${extra}`);
                    changed = true;
                  }
                } else {
                  const extra = `${swiftVfsFlag}${hasUseFwModulemap ? " " + swiftUseFwFlags : ""}`;
                  content = content.trimEnd() + `\nOTHER_SWIFT_FLAGS = $(inherited) ${extra}\n`;
                  changed = true;
                }

                if (changed) {
                  fs.writeFileSync(xcconfigPath, content, "utf8");
                  patchedCount++;
                }
              }
              console.log(`✅ 已为 ${patchedCount} 个 .xcconfig 补齐 React-VFS.yaml / modulemap / Swift -I 编译参数`);
            }
          }
          EOF

      - name: 🔨 编译 iOS App (禁用代码签名)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true" # 禁用 Sentry 符号表自动上传，防止缺少 Token 报错
          SENTRY_ALLOW_FAILURE: "true"
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios
          xcodebuild build \
            -workspace BBPlayer.xcworkspace \
            -scheme BBPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log" || {
              echo "❌ xcodebuild 编译失败，提取关键错误日志如下："
              grep -E "(❌|error:|fatal error:|BUILD FAILED)" "$RUNNER_TEMP/build-ios.log" | tail -n 120 || true
              exit 1
            }

      - name: 📄 上传构建错误日志 (仅失败时触发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-error-log
          path: ${{ runner.temp }}/build-ios.log
          retention-days: 7

      - name: 📦 打包为未签名 .ipa
        run: |
          cd apps/mobile/ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "✅ 找到 App 路径: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y -q BBPlayer-unsigned.ipa Payload

          mkdir -p "${GITHUB_WORKSPACE}/dist"
          mv BBPlayer-unsigned.ipa "${GITHUB_WORKSPACE}/dist/"

      - name: 🚀 上传 IPA 产物到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BBPlayer-iOS-Unsigned
          path: dist/BBPlayer-unsigned.ipa
          retention-days: 30
