              "export const compareSemver = (a: string, b: string): number => {",
              "    const parse = (value: string): number[] | null => {",
              "        const core = value.trim().replace(/^v/i, '').split(/[+-]/, 1)[0]",
              "        if (!/^\\d+(?:\\.\\d+){0,2}$/.test(core)) return null",
              "        const parts = core.split('.').map(Number)",
              "        if (parts.some((part) => !Number.isSafeInteger(part) || part < 0)) return null",
              "        return [parts[0] ?? 0, parts[1] ?? 0, parts[2] ?? 0]",
              "    }",
              "    const leftParts = parse(a)",
              "    const rightParts = parse(b)",
              "    if (!leftParts || !rightParts) return 0",
              "    for (let i = 0; i < 3; i++) {",
              "        if (leftParts[i] !== rightParts[i]) return leftParts[i] > rightParts[i] ? 1 : -1",
              "    }",
              "    return 0",
              "}",
              "",
            ].join("\n");
            const semverComparePattern = /export const compareSemver = \(a: string, b: string\): number => \{[\s\S]*?\r?\n\}/;
            if (!semverComparePattern.test(updateSvcCode)) {
              throw new Error("未找到 updateService.ts 的 compareSemver 声明，无法修复版本判断逻辑");
            }
            // numericCompareSemver 在声明处已经拼接为字符串，不能再次调用 join。
            updateSvcCode = updateSvcCode.replace(semverComparePattern, numericCompareSemver);
