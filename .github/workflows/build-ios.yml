            fs.writeFileSync(themeSectionPath, "import Icon from '@react-native-vector-icons/material-design-icons'\nimport Color from 'color'\nimport { useState } from 'react'\nimport { Pressable, ScrollView, StyleSheet, View } from 'react-native'\nimport { Text, useTheme } from 'react-native-paper'\n\nimport ThemeColorPickerModal from './ThemeColorPickerModal'\n\nimport useAppStore from '@/hooks/stores/useAppStore'\n\nexport interface ThemePreset {\n\tkey: string\n\tlabel: string\n\tcolor?: string\n}\n\nexport const THEME_COLOR_PRESETS: ThemePreset[] = [\n\t{ key: 'default', label: '默认', color: undefined },\n\t{ key: 'red', label: '红', color: '#E53935' },\n\t{ key: 'orange', label: '橙', color: '#FB8C00' },\n\t{ key: 'yellow', label: '黄', color: '#FBC02D' },\n\t{ key: 'green', label: '绿', color: '#43A047' },\n\t{ key: 'blue', label: '蓝', color: '#1E88E5' },\n\t{ key: 'indigo', label: '靛', color: '#3949AB' },\n\t{ key: 'violet', label: '紫', color: '#8E24AA' },\n]\n\nexport default function ThemeColorSection() {\n\tconst colors = useTheme().colors\n\tconst themeColor = useAppStore((state) => state.settings.themeColor)\n\tconst setSettings = useAppStore((state) => state.setSettings)\n\tconst [pickerVisible, setPickerVisible] = useState(false)\n\n\tconst isPresetMatch = (presetColor?: string) => {\n\t\tif (!themeColor && !presetColor) return true\n\t\tif (!themeColor || !presetColor) return false\n\t\treturn themeColor.toLowerCase() === presetColor.toLowerCase()\n\t}\n\n\tconst isCustomActive =\n\t\tBoolean(themeColor) &&\n\t\t!THEME_COLOR_PRESETS.some(\n\t\t\t(p) => p.color && p.color.toLowerCase() === themeColor?.toLowerCase(),\n\t\t)\n\n\tconst handleSelectPreset = (color?: string) => {\n\t\tsetSettings({ themeColor: color })\n\t}\n\n\tconst handleCustomColorSelected = (colorHex: string) => {\n\t\tsetSettings({ themeColor: colorHex })\n\t}\n\n\treturn (\n\t\t<View style={styles.container}>\n\t\t\t<ScrollView\n\t\t\t\thorizontal\n\t\t\t\tshowsHorizontalScrollIndicator={false}\n\t\t\t\tcontentContainerStyle={styles.scrollContainer}\n\t\t\t>\n\t\t\t\t{THEME_COLOR_PRESETS.map((preset) => {\n\t\t\t\t\tconst active = isPresetMatch(preset.color) && !isCustomActive\n\t\t\t\t\tconst displayColor = preset.color ?? colors.primary\n\t\t\t\t\tconst isDark = (() => {\n\t\t\t\t\t\ttry {\n\t\t\t\t\t\t\treturn Color(displayColor).isDark()\n\t\t\t\t\t\t} catch {\n\t\t\t\t\t\t\treturn true\n\t\t\t\t\t\t}\n\t\t\t\t\t})()\n\n\t\t\t\t\treturn (\n\t\t\t\t\t\t<Pressable\n\t\t\t\t\t\t\tkey={preset.key}\n\t\t\t\t\t\t\tstyle={styles.item}\n\t\t\t\t\t\t\tonPress={() => handleSelectPreset(preset.color)}\n\t\t\t\t\t\t\taccessibilityRole='button'\n\t\t\t\t\t\t\taccessibilityLabel={`选择${preset.label}主题色`}\n\t\t\t\t\t\t>\n\t\t\t\t\t\t\t<View\n\t\t\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\t\t\tstyles.colorCircle,\n\t\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\t\tbackgroundColor: preset.color ?? colors.primary,\n\t\t\t\t\t\t\t\t\t\tborderColor: active ? colors.onSurface : 'transparent',\n\t\t\t\t\t\t\t\t\t},\n\t\t\t\t\t\t\t\t\tactive && styles.activeCircle,\n\t\t\t\t\t\t\t\t]}\n\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t{active && (\n\t\t\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\t\t\tname='check'\n\t\t\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\t\t\tcolor={isDark ? '#FFFFFF' : '#000000'}\n\t\t\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t\t\t)}\n\t\t\t\t\t\t\t</View>\n\t\t\t\t\t\t\t<Text\n\t\t\t\t\t\t\t\tvariant='bodySmall'\n\t\t\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\t\t\tstyles.label,\n\t\t\t\t\t\t\t\t\tactive\n\t\t\t\t\t\t\t\t\t\t? [styles.activeLabel, { color: colors.primary }]\n\t\t\t\t\t\t\t\t\t\t: { color: colors.onSurfaceVariant },\n\t\t\t\t\t\t\t\t]}\n\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t{preset.label}\n\t\t\t\t\t\t\t</Text>\n\t\t\t\t\t\t</Pressable>\n\t\t\t\t\t)\n\t\t\t\t})}\n\n\t\t\t\t{/* 自定义颜色选项 */}\n\t\t\t\t<Pressable\n\t\t\t\t\tstyle={styles.item}\n\t\t\t\t\tonPress={() => setPickerVisible(true)}\n\t\t\t\t\taccessibilityRole='button'\n\t\t\t\t\taccessibilityLabel='自定义主题色'\n\t\t\t\t>\n\t\t\t\t\t<View\n\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\tstyles.colorCircle,\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\tbackgroundColor: isCustomActive\n\t\t\t\t\t\t\t\t\t? themeColor\n\t\t\t\t\t\t\t\t\t: colors.surfaceVariant,\n\t\t\t\t\t\t\t\tborderColor: isCustomActive ? colors.onSurface : 'transparent',\n\t\t\t\t\t\t\t},\n\t\t\t\t\t\t\tisCustomActive && styles.activeCircle,\n\t\t\t\t\t\t]}\n\t\t\t\t\t>\n\t\t\t\t\t\t{isCustomActive ? (\n\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\tname='check'\n\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\tcolor={\n\t\t\t\t\t\t\t\t\tthemeColor && Color(themeColor).isDark()\n\t\t\t\t\t\t\t\t\t\t? '#FFFFFF'\n\t\t\t\t\t\t\t\t\t\t: '#000000'\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t) : (\n\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\tname='palette-outline'\n\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\tcolor={colors.onSurfaceVariant}\n\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t)}\n\t\t\t\t\t</View>\n\t\t\t\t\t<Text\n\t\t\t\t\t\tvariant='bodySmall'\n\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\tstyles.label,\n\t\t\t\t\t\t\tisCustomActive\n\t\t\t\t\t\t\t\t? [styles.activeLabel, { color: colors.primary }]\n\t\t\t\t\t\t\t\t: { color: colors.onSurfaceVariant },\n\t\t\t\t\t\t]}\n\t\t\t\t\t>\n\t\t\t\t\t\t自定义\n\t\t\t\t\t</Text>\n\t\t\t\t</Pressable>\n\t\t\t</ScrollView>\n\n\t\t\t<ThemeColorPickerModal\n\t\t\t\tvisible={pickerVisible}\n\t\t\t\tcurrentColor={isCustomActive ? themeColor : undefined}\n\t\t\t\tonDismiss={() => setPickerVisible(false)}\n\t\t\t\tonSelect={handleCustomColorSelected}\n\t\t\t/>\n\t\t</View>\n\t)\n}\n\nconst styles = StyleSheet.create({\n\tcontainer: {\n\t\tmarginTop: 8,\n\t\tmarginBottom: 8,\n\t},\n\tscrollContainer: {\n\t\tflexDirection: 'row',\n\t\talignItems: 'center',\n\t\tpaddingVertical: 8,\n\t\tpaddingRight: 16,\n\t\tgap: 16,\n\t},\n\titem: {\n\t\talignItems: 'center',\n\t\tjustifyContent: 'center',\n\t},\n\tcolorCircle: {\n\t\twidth: 44,\n\t\theight: 44,\n\t\tborderRadius: 22,\n\t\talignItems: 'center',\n\t\tjustifyContent: 'center',\n\t\tborderWidth: 2,\n\t},\n\tactiveCircle: {\n\t\tborderWidth: 2.5,\n\t\ttransform: [{ scale: 1.08 }],\n\t\televation: 3,\n\t\tshadowColor: '#000',\n\t\tshadowOffset: { width: 0, height: 2 },\n\t\tshadowOpacity: 0.25,\n\t\tshadowRadius: 3.84,\n\t},\n\tlabel: {\n\t\tmarginTop: 6,\n\t\ttextAlign: 'center',\n\t\tfontWeight: '500',\n\t},\n\tactiveLabel: {\n\t\tfontWeight: 'bold',\n\t},\n})\n", "utf8");
            console.log("✅ 已写入 ThemeColorSection.tsx");
          }
          const appearancePagePath = "apps/mobile/src/app/settings/appearance/index.tsx";
          if (fs.existsSync(appearancePagePath)) {
            let appCode = fs.readFileSync(appearancePagePath, "utf8");
            if (!appCode.includes("ThemeColorSection")) {
              appCode = appCode.replace(
                "import ThemeSection from '@/features/theme/ThemeSection'",
                "import ThemeColorSection from '@/features/theme/ThemeColorSection'\nimport ThemeSection from '@/features/theme/ThemeSection'"
              );
              appCode = appCode.replace(
                "<SettingsSectionTitle title='主题' />",
                "<SettingsSectionTitle title='主题色' />\n\t\t\t\t<ThemeColorSection />\n\n\t\t\t\t<SettingsSectionTitle title='主题' />"
              );
              fs.writeFileSync(appearancePagePath, appCode, "utf8");
              console.log("✅ 已在 appearance/index.tsx 中渲染主题色设置项");
            }
          }
          EOF
      - name: 🎵 注册并预构建 iOS Now Playing Live Activity (彻底修复空白与重复卡片)
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { spawnSync } = require("child_process");

          const activityPath = "apps/mobile/src/features/live-activity/NowPlayingActivity.tsx";
          const widgetsIndexPath = "apps/mobile/widgets/index.tsx";
          const bridgePath = "apps/mobile/src/features/live-activity/NowPlayingActivityBridge.tsx";
          const appConfigPath = "apps/mobile/app.config.ts";

          if (fs.existsSync(appConfigPath)) {
            let appConfig = fs.readFileSync(appConfigPath, "utf8");
            if (!appConfig.includes("expo-widgets")) {
              if (!/plugins\s*:\s*\[/.test(appConfig)) {
                throw new Error("app.config.ts 中未找到 plugins 数组，无法注册 expo-widgets 扩展");
              }
              appConfig = appConfig.replace(
                /plugins\s*:\s*\[/,
                "plugins: [['expo-widgets', { src: './widgets', groupIdentifier: 'group.com.roitium.bbplayer', frequentUpdates: true }],"
              );
              fs.writeFileSync(appConfigPath, appConfig, "utf8");
              console.log("✅ 已向 app.config.ts 注册 expo-widgets Live Activity 扩展");
            }
          }

          fs.mkdirSync(path.dirname(activityPath), { recursive: true });
          fs.mkdirSync(path.dirname(widgetsIndexPath), { recursive: true });

          const activitySource = [
            "import { HStack, Image, Text, VStack } from '@expo/ui/swift-ui'",
            "import { activityBackgroundTint, font, foregroundStyle, padding, widgetURL } from '@expo/ui/swift-ui/modifiers'",
            "import { createLiveActivity, type LiveActivityLayout } from 'expo-widgets'",
            "",
            "export type NowPlayingProps = {",
            "  title: string",
            "  artist: string",
            "}",
            "",
            "export function NowPlayingWidgetLayout(props: NowPlayingProps): LiveActivityLayout {",
            "  'widget'",
            "  const title = props.title || '正在播放'",
            "  const artist = props.artist || 'BBPlayer'",
            "  const titleText = (",
            "    <Text modifiers={[font({ weight: 'semibold', size: 15 }), foregroundStyle('#FFFFFF')]}>",
            "      {title}",
            "    </Text>",
            "  )",
            "  const artistText = (",
            "    <Text modifiers={[font({ size: 13 }), foregroundStyle('#D1D1D6')]}>",
            "      {artist}",
            "    </Text>",
            "  )",
            "  const bannerView = (",
            "    <HStack",
            "      spacing={12}",
            "      modifiers={[",
            "        padding({ horizontal: 16, vertical: 14 }),",
            "        activityBackgroundTint('#1C1C1E'),",
            "        widgetURL('bbplayer://'),",
            "      ]}",
            "    >",
            "      <Image systemName=\"music.note\" color=\"#FB7299\" />",
            "      <VStack alignment=\"leading\" spacing={3}>",
            "        {titleText}",
            "        {artistText}",
            "      </VStack>",
            "      <HStack spacing={8} modifiers={[padding({ leading: 8 })]}>",
            "        <Image systemName=\"waveform\" color=\"#FB7299\" />",
            "      </HStack>",
            "    </HStack>",
            "  )",
            "",
            "  return {",
            "    banner: bannerView,",
            "    bannerSmall: bannerView,",
            "    compactLeading: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    compactTrailing: <Image systemName=\"waveform\" color=\"#FB7299\" />,",
            "    minimal: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    expandedLeading: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    expandedCenter: (",
            "      <VStack alignment=\"leading\" spacing={3}>",
            "        {titleText}",
            "        {artistText}",
            "      </VStack>",
            "    ),",
            "    expandedTrailing: <Image systemName=\"waveform\" color=\"#FB7299\" />,",
            "    expandedBottom: (",
            "      <HStack modifiers={[padding({ horizontal: 12, vertical: 4 })]}>",
            "        <Text modifiers={[font({ size: 12 }), foregroundStyle('#8E8E93')]}>BBPlayer 正在播放</Text>",
            "      </HStack>",
            "    ),",
            "  }",
            "}",
            "",
            "export const NowPlayingActivity = createLiveActivity<NowPlayingProps>('NowPlayingActivity', NowPlayingWidgetLayout)",
            "export default NowPlayingActivity",
            ""
          ].join("\n");
          fs.writeFileSync(activityPath, activitySource, "utf8");

          const widgetsIndexSource = [
            "'widget'",
            "import { NowPlayingWidgetLayout, NowPlayingActivity } from '../src/features/live-activity/NowPlayingActivity'",
            "",
            "export default NowPlayingWidgetLayout",
            "export { NowPlayingActivity }",
            ""
          ].join("\n");
          fs.writeFileSync(widgetsIndexPath, widgetsIndexSource, "utf8");

          const bridgeSource = [
            "import { useEffect, useRef } from 'react'",
            "import { usePlayerStore } from '@/hooks/stores/usePlayerStore'",
            "import { NowPlayingActivity, type NowPlayingProps } from './NowPlayingActivity'",
            "",
            "export function NowPlayingActivityBridge() {",
            "  const track = usePlayerStore((state) => state.internalTrack)",
            "  const isSyncingRef = useRef(false)",
            "",
            "  useEffect(() => {",
            "    let cancelled = false",
            "",
            "    const syncActivity = async () => {",
            "      if (isSyncingRef.current) return",
            "      isSyncingRef.current = true",
            "",
            "      try {",
            "        const instances = NowPlayingActivity.getInstances()",
            "",
            "        if (!track) {",
            "          if (instances.length > 0) {",
            "            await Promise.all(instances.map((i: any) => i.end('immediate').catch(() => undefined)))",
            "          }",
            "          return",
            "        }",
            "",
            "        const rawArtist = (track as any).artist ?? (track as any).artists",
            "        const artist = typeof rawArtist === 'string'",
            "          ? rawArtist",
            "          : Array.isArray(rawArtist)",
            "            ? rawArtist.map((item: any) => typeof item === 'string' ? item : item?.name).filter(Boolean).join(', ')",
            "            : rawArtist?.name ?? ''",
            "",
            "        const props: NowPlayingProps = {",
            "          title: (track as any).title || '正在播放',",
            "          artist: artist || 'BBPlayer',",
            "        }",
            "",
            "        if (instances.length > 1) {",
            "          await Promise.all(instances.slice(1).map((i: any) => i.end('immediate').catch(() => undefined)))",
            "        }",
            "",
            "        if (cancelled) return",
            "",
            "        if (instances.length > 0) {",
            "          try {",
            "            await instances[0].update(props)",
            "            return",
            "          } catch (updateErr) {",
            "            console.warn('[LiveActivity] update failed, recreate single card:', updateErr)",
            "            await instances[0].end('immediate').catch(() => undefined)",
            "          }",
            "        }",
            "",
            "        if (!cancelled) {",
            "          await NowPlayingActivity.start(props, 'bbplayer://')",
            "        }",
            "      } catch (err) {",
            "        console.warn('[LiveActivity] syncActivity error:', err)",
            "      } finally {",
            "        isSyncingRef.current = false",
            "      }",
            "    }",
            "",
            "    void syncActivity()",
            "",
            "    return () => {",
            "      cancelled = true",
            "    }",
            "  }, [track])",
            "",
            "  return null",
            "}",
            ""
          ].join("\n");
          fs.writeFileSync(bridgePath, bridgeSource, "utf8");

          const layoutPath = "apps/mobile/src/app/_layout.tsx";
          if (fs.existsSync(layoutPath)) {
            let layout = fs.readFileSync(layoutPath, "utf8");
            if (!layout.includes("NowPlayingActivityBridge")) {
              layout = layout.replace(
                "import NowPlayingBar from '@/components/NowPlayingBar'",
                "import NowPlayingBar from '@/components/NowPlayingBar'\nimport { NowPlayingActivityBridge } from '@/features/live-activity/NowPlayingActivityBridge'"
              );
              layout = layout.replace(
                "<NowPlayingBar />",
                "<NowPlayingActivityBridge />\n\t\t\t\t<NowPlayingBar />"
              );
              fs.writeFileSync(layoutPath, layout, "utf8");
              console.log("✅ 已在根路由 _layout.tsx 挂载唯一 NowPlayingActivityBridge 单例");
            }
          }

          const barPath = "apps/mobile/src/components/NowPlayingBar.tsx";
          if (fs.existsSync(barPath)) {
            let bar = fs.readFileSync(barPath, "utf8");
            if (bar.includes("NowPlayingActivityBridge")) {
              bar = bar.replace(/import\s+\{\s*NowPlayingActivityBridge\s*\}\s+from\s+['"]@\/features\/live-activity\/NowPlayingActivityBridge['"];?\n?/, "");
              bar = bar.replace(/<NowPlayingActivityBridge\s*\/>\n?\s*/, "");
              fs.writeFileSync(barPath, bar, "utf8");
              console.log("✅ 已从 NowPlayingBar.tsx 清理冗余挂载");
            }
          }

          console.log("🔍 正在预构建 ExpoWidgets.bundle (彻底解决 Issue #43646)...");

          function findExpoWidgetsDirs(startDir, results = []) {
            if (!fs.existsSync(startDir)) return results;
            for (const item of fs.readdirSync(startDir)) {
              const full = path.join(startDir, item);
              try {
                if (item === "expo-widgets" && fs.existsSync(path.join(full, "package.json"))) {
                  results.push(full);
                } else if (fs.statSync(full).isDirectory() && !full.includes(".git") && !full.includes("ios/build")) {
                  if (item === "node_modules" || item === ".pnpm" || item === "apps") {
                    findExpoWidgetsDirs(full, results);
                  }
                }
              } catch (e) {}
            }
            return results;
          }

          const expoWidgetsDirs = findExpoWidgetsDirs("node_modules");
          if (fs.existsSync("apps/mobile/node_modules")) {
            findExpoWidgetsDirs("apps/mobile/node_modules", expoWidgetsDirs);
          }
          console.log(`找到 ${expoWidgetsDirs.length} 个 expo-widgets 路径`);

          for (const pkgDir of expoWidgetsDirs) {
            const buildMjs = path.join(pkgDir, "scripts/build-bundle.mjs");
            if (fs.existsSync(buildMjs)) {
              let mjs = fs.readFileSync(buildMjs, "utf8");
              mjs = mjs.replace("import spawn from '@expo/spawn-async';", "import { spawnSync } from 'node:child_process';");
              const mjsPattern = /const result = await spawn[\s\S]*?if \(result\.error\) \{[\s\S]*?\}/;
              if (mjsPattern.test(mjs)) {
                mjs = mjs.replace(mjsPattern, [
                  "const { createRequire } = await import('node:module');",
                  "const projRequire = createRequire(path.join(projectRoot, 'package.json'));",
                  "let expoCli;",
                  "try { expoCli = projRequire.resolve('expo/bin/cli'); } catch { expoCli = require.resolve('expo/bin/cli'); }",
                  "console.log('⚡ 使用 Expo CLI 独立导出 Widget 运行时:', expoCli);",
                  "const res = spawnSync(nodePath, [",
                  "  expoCli,",
                  "  'export:embed',",
                  "  '--platform',",
                  "  'ios',",
                  "  '--bundle-output',",
                  "  appBundlePath,",
                  "  '--entry-file',",
                  "  path.join(__dirname, '../bundle/index.ts'),",
                  "  '--dev',",
                  "  'false',",
                  "  '--skip-server'",
                  "], {",
                  "  stdio: 'inherit',",
                  "  cwd: projectRoot,",
                  "  env: {",
                  "    ...process.env,",
                  "    EXPO_OVERRIDE_METRO_CONFIG: path.join(__dirname, '../metro.config.js'),",
                  "  }",
                  "});",
                  "if (res.status !== 0) throw new Error('expo export:embed 退出码非零: ' + res.status);"
                ].join("\n"));
                fs.writeFileSync(buildMjs, mjs, "utf8");
                console.log("✅ 已修复 build-bundle.mjs:", buildMjs);
              }
            }

            const metroCfg = path.join(pkgDir, "metro.config.js");
            if (fs.existsSync(metroCfg)) {
              let metro = fs.readFileSync(metroCfg, "utf8");
              metro = metro.replace("const { resolveWorkspaceRoot } = require('resolve-workspace-root');", [
                "const resolveWorkspaceRoot = (start) => {",
                "  let cur = start;",
                "  while (cur && cur !== path.dirname(cur)) {",
                "    if (fs.existsSync(path.join(cur, 'pnpm-workspace.yaml'))) return cur;",
                "    cur = path.dirname(cur);",
                "  }",
                "  return start;",
                "};"
              ].join("\n"));
              fs.writeFileSync(metroCfg, metro, "utf8");
              console.log("✅ 已修复 metro.config.js:", metroCfg);
            }

            const podspec = path.join(pkgDir, "ios/ExpoWidgets.podspec");
            if (fs.existsSync(podspec)) {
              let p = fs.readFileSync(podspec, "utf8");
              p = p.split('cp "${source}" "${dest}"').join('cp -R "${source}" "${dest}"');
              fs.writeFileSync(podspec, p, "utf8");
              console.log("✅ 已修复 ExpoWidgets.podspec 拷贝指令");
            }
          }

          const targetPkg = expoWidgetsDirs[0];
          if (!targetPkg) throw new Error("未找到 expo-widgets 安装路径");

          const projectRoot = path.resolve("apps/mobile");
          const bundleScript = path.join(targetPkg, "scripts/build-bundle.mjs");
          console.log("🚀 开始预构建 ExpoWidgets.bundle (projectRoot:", projectRoot, ")...");
          const runBuild = spawnSync("node", [bundleScript, projectRoot], {
            stdio: "inherit",
            cwd: projectRoot,
            env: process.env,
          });

          if (runBuild.status !== 0) {
            throw new Error("ExpoWidgets.bundle 预构建失败，退出码: " + runBuild.status);
          }

          const generatedBundle = path.join(targetPkg, "bundle/build/ExpoWidgets.bundle");
          if (!fs.existsSync(generatedBundle) || fs.statSync(generatedBundle).size < 1000) {
            throw new Error("预构建完成但产物文件不存在或过小: " + generatedBundle);
          }
          const bundleSize = fs.statSync(generatedBundle).size;
          console.log(`✅ 成功生成官方 ExpoWidgets.bundle 运行时 JS (${bundleSize} 字节)`);

          function createStructuredBundle(destDir) {
            fs.mkdirSync(destDir, { recursive: true });
            fs.copyFileSync(generatedBundle, path.join(destDir, "ExpoWidgets.bundle"));
            fs.copyFileSync(generatedBundle, path.join(destDir, "index.js"));
            const plist = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>CFBundleIdentifier</key>\n  <string>org.cocoapods.ExpoWidgets</string>\n  <key>CFBundleName</key>\n  <string>ExpoWidgets</string>\n  <key>CFBundlePackageType</key>\n  <string>BNDL</string>\n</dict>\n</plist>';
            fs.writeFileSync(path.join(destDir, "Info.plist"), plist, "utf8");
          }

          createStructuredBundle(path.resolve("apps/mobile/ios/ExpoWidgets.bundle"));
          createStructuredBundle(path.resolve("apps/mobile/ios/ExpoWidgetsTarget/ExpoWidgets.bundle"));
          createStructuredBundle(path.join(targetPkg, "bundle/build/ExpoWidgets.bundle_dir"));
          console.log("✅ 已成功组装双层 Bundle 结构并就绪");
          EOF
      - name: 📱 生成 iOS 原生工程 (Expo Prebuild)
        run: |
          set -o pipefail
          export VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Calculated VERSION_CODE=$VERSION_CODE"
          cd apps/mobile
          # 关键修复 2：将 react-native-screens 加入 RNRepo iOS 预编译黑名单 (denyList.ios)
          # 原因：RNRepo 预编译的 RNScreens.xcframework 仅包含文本格式的 .swiftinterface（无二进制 .swiftmodule），
          # 而 ExpoRouter (Swift) 在 import RNScreens 时会触发 swiftc 的 ModuleInterfaceLoader 启动隔离子编译器，
          # 该子编译器会强制剥离父进程的所有 -Xcc 参数（包括 -Xcc -ivfsoverlay React-VFS.yaml），导致 RNScreens 伞形头文件报错找不到 <React/RCTEventDispatcherProtocol.h>。
          # 将 react-native-screens 设为源码编译后，Expo 会将其编译为静态库并生成二进制 RNScreens.swiftmodule，彻底规避 .swiftinterface 子编译问题。
          node -e '
            const fs = require("fs");
            const cfgPath = "rnrepo.config.json";
            const cfg = fs.existsSync(cfgPath) ? JSON.parse(fs.readFileSync(cfgPath, "utf8")) : {};
            cfg.denyList = cfg.denyList || {};
            const iosDeny = new Set(Array.isArray(cfg.denyList.ios) ? cfg.denyList.ios : []);
            iosDeny.add("react-native-screens");
            cfg.denyList.ios = Array.from(iosDeny);
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n", "utf8");
            console.log("✅ 已配置 apps/mobile/rnrepo.config.json:", JSON.stringify(cfg));
          '
          # 必须带 --no-install，确保在注入 $RNFirebaseDisableSPM 之后再统一执行 pod install
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          # Expo 会从 package.json 生成 MARKETING_VERSION；这里再次锁定它，防止旧的
          # ios 工程缓存或 app.config 覆盖 RELEASE_VERSION，导致 IPA 仍显示 1.0.0。
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const releaseVersion = (process.env.RELEASE_VERSION || "").trim().replace(/^v/i, "").split("-")[0];
          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion)) {
            throw new Error(`RELEASE_VERSION 无效: ${releaseVersion}`);
          }
          const iosRoot = path.resolve("ios");
          const walk = (dir, result = []) => {
            if (!fs.existsSync(dir)) return result;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (["Pods", "build"].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, result);
              else result.push(full);
            }
            return result;
          };
          const projectFiles = walk(iosRoot).filter((file) => file.endsWith(".pbxproj"));
          let projectCount = 0;
          for (const projectPath of projectFiles) {
            let project = fs.readFileSync(projectPath, "utf8");
            const updated = project.replace(/MARKETING_VERSION\s*=\s*[^;]+;/g, `MARKETING_VERSION = ${releaseVersion};`);
            if (updated !== project) {
              fs.writeFileSync(projectPath, updated, "utf8");
              projectCount++;
            }
          }
          if (projectFiles.length === 0) throw new Error("Expo prebuild 后未找到 iOS .pbxproj");
          console.log(`✅ 已锁定 iOS MARKETING_VERSION=${releaseVersion}（更新 ${projectCount} 个工程）`);
          EOF
          # 关键修复：确保 Info.plist 中 100% 写入 UIAppFonts 与 ExpoShareIntoAppGroupId
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          function findPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findPlist(full);
                if (found) return found;
              } else if (f.name === "Info.plist") {
                return full;
              }
            }
            return null;
          }
          const plistPath = findPlist("ios") || findPlist("apps/mobile/ios");
          if (plistPath) {
            console.log("🔍 检查生成的 Info.plist:", plistPath);
            let content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("NSAppTransportSecurity")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 NSAppTransportSecurity (NSAllowsArbitraryLoads=true)");
            }
            if (!content.includes("MaterialDesignIcons.ttf")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string MaterialDesignIcons.ttf" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIAppFonts (MaterialDesignIcons.ttf)");
            }
            if (!content.includes("ExpoShareIntoAppGroupId")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :ExpoShareIntoAppGroupId string group.com.roitium.bbplayer" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 ExpoShareIntoAppGroupId");
            }
            if (!content.includes("audio")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIBackgroundModes (audio 后台播放)");
            }
            content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("UIApplicationSceneManifest")) {
              const sceneManifestXml = "\\t<key>UIApplicationSceneManifest</key>\\n\\t<dict>\\n\\t\\t<key>UIApplicationSupportsMultipleScenes</key>\\n\\t\\t<false/>\\n\\t\\t<key>UISceneConfigurations</key>\\n\\t\\t<dict>\\n\\t\\t\\t<key>UIWindowSceneSessionRoleApplication</key>\\n\\t\\t\\t<array>\\n\\t\\t\\t\\t<dict>\\n\\t\\t\\t\\t\\t<key>UISceneConfigurationName</key>\\n\\t\\t\\t\\t\\t<string>Default Configuration</string>\\n\\t\\t\\t\\t\\t<key>UISceneDelegateClassName</key>\\n\\t\\t\\t\\t\\t<string>EXExpoAppSceneDelegate</string>\\n\\t\\t\\t\\t</dict>\\n\\t\\t\\t</array>\\n\\t\\t</dict>\\n\\t</dict>\\n</dict>\\n</plist>";
              content = content.replace(new RegExp("</dict>\\s*</plist>"), sceneManifestXml);
              fs.writeFileSync(plistPath, content, "utf8");
              console.log("✅ Info.plist: 已补齐 UIApplicationSceneManifest 配置 (解决 iOS 27 启动断言闪退)");
            }
          }
          function findAppDelegate(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findAppDelegate(full);
                if (found) return found;
              } else if (f.name === "AppDelegate.swift" || f.name === "AppDelegate.mm" || f.name === "AppDelegate.m") {
                return full;
              }
            }
            return null;
          }
          const appDelegatePath = findAppDelegate("ios") || findAppDelegate("apps/mobile/ios");
          if (appDelegatePath) {
            let appDelegate = fs.readFileSync(appDelegatePath, "utf8");
            if (appDelegatePath.endsWith(".swift")) {
              if (appDelegate.includes("class AppDelegate: ExpoAppDelegate {") && !appDelegate.includes("ExpoReactNativeFactoryProvider")) {
                appDelegate = appDelegate.replace("class AppDelegate: ExpoAppDelegate {", "class AppDelegate: ExpoAppDelegate, ExpoReactNativeFactoryProvider {");
                const windowStmt = /^[ \t]*window = UIWindow\(frame: UIScreen\.main\.bounds\)\r?\n/m;
                const startStmt = /^[ \t]*factory\.startReactNative\([^)]*\)\r?\n/m;
                const emptyWrapper = /^[ \t]*#if os\(iOS\) \|\| os\(tvOS\)\r?\n[ \t]*#endif\r?\n/m;
                appDelegate = appDelegate.replace(windowStmt, "").replace(startStmt, "").replace(emptyWrapper, "");
                fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
                console.log("✅ AppDelegate.swift: 已补全 ExpoReactNativeFactoryProvider 协议支持 (UIScene)");
              }
            } else if (appDelegate.includes("self.window.backgroundColor = [UIColor whiteColor];")) {
              appDelegate = appDelegate.replace(
                "self.window.backgroundColor = [UIColor whiteColor];",
                "self.window.backgroundColor = [UIColor systemBackgroundColor];"
              );
              fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
              console.log("✅ AppDelegate: 已将 window.backgroundColor 调整为 systemBackgroundColor");
            }
          }
          EOF
      - name: 🍎 安装 CocoaPods 依赖
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios
          # 关键修复 3：在 Podfile 顶部安全注入 $RNFirebaseDisableSPM = true（避免用单行 sed 破坏多行语法）
          grep -q 'RNFirebaseDisableSPM' Podfile || {
            printf '%s\n%s\n' '$RNFirebaseDisableSPM = true' "$(cat Podfile)" > Podfile
          }
          pod install --repo-update 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          # 防御性检查：若未来 RNRepo 预编译产物的 Swift 主次版本高于当前 Runner 的 Swift 编译器，自动回退为源码编译
          if ! ruby -e '
            local = `xcrun swiftc -version`[/Apple Swift version (\d+\.\d+)/, 1]
            exit 0 unless local
            Dir.glob("../../../node_modules/**/.rnrepo-cache/**/*.swiftinterface").each do |f|
              pkg = File.read(f, 2048)[/-interface-compiler-version (\d+\.\d+)/, 1]
              if pkg && Gem::Version.new(pkg) > Gem::Version.new(local)
                puts "RNRepo Swift #{pkg} > Local Swift #{local} (#{f})"
                exit 1
              end
            end
          '; then
            echo "⚠️ 检测到 RNRepo 预编译包 Swift 版本高于当前 Xcode，自动切换为 DISABLE_RNREPO=1 源码安装..."
            DISABLE_RNREPO=1 pod install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          fi
          # 关键修复 4：修复 React-Core-prebuilt + useFrameworks: 'static' 在 Release 构建下的头文件与模块映射问题：
          # 1) 提前将 React-Core-prebuilt 切换至 Release 切片，防止 xcodebuild 阶段 replace-rncore-version.js 重新解压覆盖补丁。
          # 2) 将 React.xcframework 内部按子模块嵌套的头文件（如 Headers/React_Core/React/*.h、Headers/Yoga/yoga/*.h 等）
          #    实体化平铺到磁盘上的 React.xcframework/Headers/ 与各切片的 React.framework/Headers/ 中。
          #    这样即使 swiftc 在编译任何 .swiftinterface 子模块时剥离了 -Xcc -ivfsoverlay 虚拟文件系统参数，
          #    Clang 也能直接通过 -F (React.framework/Headers/*.h) 和原生 Swift -I 物理路径找到所有 <React/*.h> 与 <yoga/*.h> 头文件。
          # 3) 补齐被 expo-modules-autolinking 的 append_macro_flags 覆盖丢失的 .xcconfig 编译参数。
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const iosDir = process.cwd();
          const podsRoot = path.join(iosDir, "Pods");
          const prebuiltDir = path.join(podsRoot, "React-Core-prebuilt");
          const xcfwDir = path.join(prebuiltDir, "React.xcframework");
          function copyDirRecursive(srcDir, destDir) {
            let copied = 0;
            if (!fs.existsSync(srcDir)) return copied;
            for (const entry of fs.readdirSync(srcDir, { withFileTypes: true })) {
              const srcPath = path.join(srcDir, entry.name);
              const destPath = path.join(destDir, entry.name);
              if (entry.isDirectory()) {
                copied += copyDirRecursive(srcPath, destPath);
              } else if (entry.isFile() && !fs.existsSync(destPath)) {
                fs.mkdirSync(destDir, { recursive: true });
                fs.copyFileSync(srcPath, destPath);
                copied++;
              }
            }
            return copied;
          }
          function materializeReactHeaders(headersRoot, isFrameworkSlice) {
            if (!fs.existsSync(headersRoot)) return 0;
            let count = 0;
            const subdirs = fs.readdirSync(headersRoot, { withFileTypes: true }).filter((d) => d.isDirectory());
            // 将 Headers/<SubspecName>/<ModulePrefix>/... 实体化平铺到 Headers/<ModulePrefix>/...
            for (const sub of subdirs) {
              const subPath = path.join(headersRoot, sub.name);
              count += copyDirRecursive(subPath, headersRoot);
            }
            // 对于 React.framework/Headers 切片目录，Clang 通过 -F 查找 `#import <React/Foo.h>` 时
            // 会直接查找 `React.framework/Headers/Foo.h`，因此同步将 `Headers/React/*` 平铺到 `React.framework/Headers/*`
            if (isFrameworkSlice) {
              const reactSubdir = path.join(headersRoot, "React");
              if (fs.existsSync(reactSubdir)) {
                count += copyDirRecursive(reactSubdir, headersRoot);
              }
            }
            return count;
          }
          if (fs.existsSync(prebuiltDir)) {
            // 1. 提前将 React-Core-prebuilt 切换至 Release 切片并写入 .last_build_configuration = "Release"
            const rnPkgPath = require.resolve("react-native/package.json", { paths: [iosDir] });
            const rnDir = path.dirname(rnPkgPath);
            const rnVersion = JSON.parse(fs.readFileSync(rnPkgPath, "utf8")).version;
            const replaceScript = path.join(rnDir, "scripts", "replace-rncore-version.js");
            if (fs.existsSync(replaceScript)) {
              console.log(`🔄 预切换 React-Core-prebuilt (${rnVersion}) 至 Release 配置...`);
              execFileSync(
                process.execPath,
                [replaceScript, "-c", "Release", "-r", rnVersion, "-p", podsRoot],
                { cwd: podsRoot, stdio: "inherit" }
              );
            }
            // 2. 基于 Release 版 React.xcframework 重新生成 React-VFS.yaml
            const vfsTemplatePath = path.join(xcfwDir, "React-VFS-template.yaml");
            const vfsPath = path.join(prebuiltDir, "React-VFS.yaml");
            if (fs.existsSync(vfsTemplatePath)) {
              const vfsContent = fs
                .readFileSync(vfsTemplatePath, "utf8")
                .replace(/\$\{ROOT_PATH\}/g, () => xcfwDir);
              fs.writeFileSync(vfsPath, vfsContent, "utf8");
              console.log(`✅ 已同步更新 Release 版 VFS 映射: ${vfsPath}`);
            }
            // 3. 实体化平铺 React.xcframework 头文件到磁盘，消除对虚拟文件系统 (VFS) 的强依赖
            let materializedCount = materializeReactHeaders(path.join(xcfwDir, "Headers"), false);
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceHeaders = path.join(xcfwDir, entry.name, "React.framework", "Headers");
                  if (fs.existsSync(sliceHeaders)) {
                    materializedCount += materializeReactHeaders(sliceHeaders, true);
                  }
                }
              }
            }
            console.log(`✅ 已实体化平铺 ${materializedCount} 个 React.xcframework 头文件到物理磁盘`);
            // 4. 重新对 Release 版 React.xcframework 应用 Expo 的 modulemap 补丁：
            //    移除 `framework module React { ... }`（保留 `React_RCTAppDelegate`）
            const fwModuleReactRegex = /framework module React \{[\s\S]*?\n\}\s*/g;
            const modulemapPaths = [path.join(xcfwDir, "Modules", "module.modulemap")];
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceMap = path.join(xcfwDir, entry.name, "React.framework", "Modules", "module.modulemap");
                  if (fs.existsSync(sliceMap)) modulemapPaths.push(sliceMap);
                }
              }
            }
            for (const mmPath of modulemapPaths) {
              if (fs.existsSync(mmPath)) {
                const orig = fs.readFileSync(mmPath, "utf8");
                const patched = orig.replace(fwModuleReactRegex, "");
                if (patched !== orig) {
                  fs.writeFileSync(mmPath, patched, "utf8");
                  console.log(`✅ 已修补 modulemap (移除 framework module React): ${path.relative(podsRoot, mmPath)}`);
                }
              }
            }
            // 5. 遍历 Target Support Files 下所有 .xcconfig，补齐 React-VFS.yaml、modulemap 以及原生 Swift -I 搜索路径
            const targetSupportDir = path.join(podsRoot, "Target Support Files");
            const useFwModulemap = path.join(targetSupportDir, "React-Core-prebuilt", "React-use-frameworks.modulemap");
            const hasUseFwModulemap = fs.existsSync(useFwModulemap);
            if (fs.existsSync(vfsPath) && fs.existsSync(targetSupportDir)) {
              const cVfsFlag = `-ivfsoverlay "${vfsPath}"`;
              const swiftVfsFlag = `-I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
              const cUseFwFlags = `-isystem "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;
              const swiftUseFwFlags = `-Xcc -isystem -Xcc "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;
              function walkXcconfigs(dir, out = []) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walkXcconfigs(full, out);
                  else if (entry.isFile() && entry.name.endsWith(".xcconfig")) out.push(full);
                }
                return out;
              }
              let patchedCount = 0;
              for (const xcconfigPath of walkXcconfigs(targetSupportDir)) {
                let content = fs.readFileSync(xcconfigPath, "utf8");
                let changed = false;
                for (const key of ["OTHER_CFLAGS", "OTHER_CPLUSPLUSFLAGS"]) {
                  const re = new RegExp(`^(${key}\\s*=\\s*)(.*)$`, "m");
                  const m = content.match(re);
                  if (m) {
                    let extra = "";
                    if (!m[2].includes("React-VFS.yaml")) extra += ` ${cVfsFlag}`;
                    if (hasUseFwModulemap && !m[2].includes("React-use-frameworks.modulemap")) extra += ` ${cUseFwFlags}`;
                    if (extra) {
                      content = content.replace(re, (_, p, v) => `${p}${v}${extra}`);
                      changed = true;
                    }
                  } else {
                    const extra = `${cVfsFlag}${hasUseFwModulemap ? " " + cUseFwFlags : ""}`;
                    content = content.trimEnd() + `\n${key} = $(inherited) ${extra}\n`;
                    changed = true;
                  }
                }
                const swiftRe = /^(OTHER_SWIFT_FLAGS\s*=\s*)(.*)$/m;
                const sm = content.match(swiftRe);
                if (sm) {
                  let extra = "";
                  if (!sm[2].includes("-I \"${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers\"")) {
                    extra += ` -I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers"`;
                  }
                  if (!sm[2].includes("React-VFS.yaml")) extra += ` -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
                  if (hasUseFwModulemap && !sm[2].includes("React-use-frameworks.modulemap")) extra += ` ${swiftUseFwFlags}`;
                  if (extra) {
                    content = content.replace(swiftRe, (_, p, v) => `${p}${v}${extra}`);
                    changed = true;
                  }
                } else {
                  const extra = `${swiftVfsFlag}${hasUseFwModulemap ? " " + swiftUseFwFlags : ""}`;
                  content = content.trimEnd() + `\nOTHER_SWIFT_FLAGS = $(inherited) ${extra}\n`;
                  changed = true;
                }
                if (changed) {
                  fs.writeFileSync(xcconfigPath, content, "utf8");
                  patchedCount++;
                }
              }
              console.log(`✅ 已为 ${patchedCount} 个 .xcconfig 补齐 React-VFS.yaml / modulemap / Swift -I 编译参数`);
            }
          }
          EOF
      - name: 🔨 编译 iOS App (禁用代码签名)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true" # 禁用 Sentry 符号表自动上传，防止缺少 Token 报错
          SENTRY_ALLOW_FAILURE: "true"
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios
          xcodebuild build \
            -workspace BBPlayer.xcworkspace \
            -scheme BBPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$RELEASE_VERSION" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log" || {
              echo "❌ xcodebuild 编译失败，提取关键错误日志如下："
              grep -E "(❌|error:|fatal error:|BUILD FAILED)" "$RUNNER_TEMP/build-ios.log" | tail -n 120 || true
              exit 1
            }
      - name: 📄 上传构建错误日志 (仅失败时触发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-error-log
          path: ${{ runner.temp }}/build-ios.log
          retention-days: 7
      - name: 🧩 确保 ExpoWidgets.bundle 100% 嵌入 Widget 扩展及主 App
        run: |
          cd apps/mobile/ios
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          console.log("🔍 正在检查构建产物并注入 ExpoWidgets.bundle 运行时...");

          let sourceBundleDir = null;
          const searchPaths = [
            path.resolve("ExpoWidgets.bundle"),
            path.resolve("ExpoWidgetsTarget/ExpoWidgets.bundle"),
          ];

          for (const p of searchPaths) {
            if (fs.existsSync(p) && fs.existsSync(path.join(p, "ExpoWidgets.bundle"))) {
              sourceBundleDir = p;
              break;
            }
          }

          if (!sourceBundleDir) {
            function findBundle(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir)) {
                const full = path.join(dir, entry);
                try {
                  if (entry === "ExpoWidgets.bundle" && fs.existsSync(path.join(full, "ExpoWidgets.bundle"))) {
                    sourceBundleDir = full;
                    return;
                  }
                  if (fs.statSync(full).isDirectory() && !full.includes(".appex") && !full.includes(".app")) {
                    findBundle(full);
                    if (sourceBundleDir) return;
                  }
                } catch (e) {}
              }
            }
            findBundle("build/Build/Products/Release-iphoneos");
            if (!sourceBundleDir) findBundle("../../../node_modules");
          }

          if (!sourceBundleDir) {
            throw new Error("❌ 严重错误：未找到任何有效的 ExpoWidgets.bundle 产物");
          }

          const bundleSize = fs.statSync(path.join(sourceBundleDir, "ExpoWidgets.bundle")).size;
          console.log(`✅ 找到有效的 ExpoWidgets.bundle 源 (${bundleSize} 字节): ${sourceBundleDir}`);

          const productsDir = "build/Build/Products/Release-iphoneos";
          const appexDirs = [];
          const appDirs = [];

          function scanProducts(dir) {
            if (!fs.existsSync(dir)) return;
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              try {
                if (item.endsWith(".appex")) {
                  appexDirs.push(full);
                } else if (item.endsWith(".app")) {
                  appDirs.push(full);
                  scanProducts(full);
                } else if (fs.statSync(full).isDirectory() && !item.endsWith(".framework") && !item.endsWith(".bundle")) {
                  scanProducts(full);
                }
              } catch (e) {}
            }
          }

          scanProducts(productsDir);
          console.log(`已发现 ${appexDirs.length} 个扩展目录 (.appex) 和 ${appDirs.length} 个应用目录 (.app)`);

          const allTargets = [...new Set([...appexDirs, ...appDirs])];
          for (const target of allTargets) {
            const destBundle = path.join(target, "ExpoWidgets.bundle");
            fs.mkdirSync(destBundle, { recursive: true });
            for (const item of fs.readdirSync(sourceBundleDir)) {
              fs.cpSync(path.join(sourceBundleDir, item), path.join(destBundle, item), { recursive: true });
            }
            const innerFile = path.join(destBundle, "ExpoWidgets.bundle");
            if (fs.existsSync(innerFile)) {
              console.log(`✅ 已成功嵌入: ${innerFile} (${fs.statSync(innerFile).size} bytes)`);
            } else {
              throw new Error("嵌入失败: " + innerFile);
            }
          }

          console.log("🎉 所有扩展与主 App 均已 100% 注入有效 ExpoWidgets.bundle 运行时！");
          EOF
      - name: 📦 打包为未签名 .ipa
        run: |
          cd apps/mobile/ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "✅ 找到 App 路径: $APP_PATH"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          if [ "$BUILT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ App 版本不匹配：期望 $RELEASE_VERSION，实际 $BUILT_VERSION"
            exit 1
          fi
          echo "✅ 已验证 IPA 应用版本: $BUILT_VERSION"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y -q BBPlayer-unsigned.ipa Payload
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          mv BBPlayer-unsigned.ipa "${GITHUB_WORKSPACE}/dist/"
      - name: 🚀 上传 IPA 产物到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BBPlayer-iOS-Unsigned
          path: dist/BBPlayer-unsigned.ipa
          retention-days: 30
