              overlayCode = overlayCode.replace("import { Pressable, StyleSheet } from 'react-native'", "import { Pressable, StyleSheet, View } from 'react-native'");
              overlayCode = overlayCode.replace(/import\s*\{\s*createAnimatedComponent,\s*useAnimatedStyle,\s*\}\s*from\s*['"]react-native-reanimated['"]/, "import Animated, {\n  createAnimatedComponent,\n  useAnimatedStyle,\n} from 'react-native-reanimated'");
              overlayCode = overlayCode.replace(/const AnimatedPressable = createAnimatedComponent\(Pressable\)\r?\n?/, "");
              overlayCode = overlayCode.replace(overlayPattern, overlayReplacement);
              fs.writeFileSync(overlayPath, overlayCode, "utf8");
              console.log("✅ 已修复 AnimatedModalOverlay.tsx 遮罩层点击穿透与事件隔离并清理未使用的 AnimatedPressable");
