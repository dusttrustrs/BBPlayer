            const target = "Orpheus.getLruCachedUris(urisToCheck.map((u) => u.uri))";
            const replacement = 'typeof Orpheus.getLruCachedUris === "function" ? Orpheus.getLruCachedUris(urisToCheck.map((u) => u.uri)) : []';
            if (detail.includes(target) && !detail.includes("typeof Orpheus.getLruCachedUris")) {
